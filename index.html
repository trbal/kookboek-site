<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kookboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --olive-50: #F4F5EF;
  --olive-100: #E4E7D9;
  --olive-300: #9AA678;
  --olive-500: #5C6B3F;
  --olive-700: #40492C;
  --olive-900: #262B19;
  --cream: #FAF7F0;
  --cream-dim: #F1EDE2;
  --paper: #FFFFFF;
  --clay-400: #D6803F;
  --clay-500: #C1622D;
  --clay-600: #A24F22;
  --ink: #2B2620;
  --ink-soft: #635B4E;
  --ink-faint: #9A9284;
  --line: #E4DECF;
  --line-strong: #D2C9B4;
  --danger: #B4402E;
  --danger-bg: #F8E8E4;
  --success: #4A6741;
  --success-bg: #EAF0E4;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: light dark;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --olive-50: #1B1E14;
    --olive-100: #262B1C;
    --cream: #17140F;
    --cream-dim: #1E1A14;
    --paper: #221E17;
    --ink: #EDE7DA;
    --ink-soft: #B8AF9E;
    --ink-faint: #83796A;
    --line: #34301F;
    --line-strong: #453F29;
    --danger-bg: #3A2420;
    --success-bg: #23301E;
  }
}
:root[data-theme="dark"] {
  --olive-50: #1B1E14;
  --olive-100: #262B1C;
  --cream: #17140F;
  --cream-dim: #1E1A14;
  --paper: #221E17;
  --ink: #EDE7DA;
  --ink-soft: #B8AF9E;
  --ink-faint: #83796A;
  --line: #34301F;
  --line-strong: #453F29;
  --danger-bg: #3A2420;
  --success-bg: #23301E;
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
}
body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--ink);
}
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
::selection { background: var(--olive-300); color: var(--olive-900); }

.app-shell { min-height: 100%; display: flex; flex-direction: column; }

/* ---- Top bar ---- */
.topbar {
  position: sticky;
  top: 0;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--cream);
  border-bottom: 1px solid var(--line);
  z-index: 40;
}
.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-shrink: 0;
}
.brand-mark { font-size: 22px; }
.brand-name { font-size: 20px; font-family: var(--font-display); font-weight: 600; }
.searchbox {
  flex: 1;
  position: relative;
  max-width: 420px;
}
.searchbox input {
  width: 100%;
  height: 42px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  padding: 0 16px 0 40px;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .15s ease;
}
.searchbox input:focus { border-color: var(--olive-500); }
.searchbox svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--ink-faint);
  pointer-events: none;
}
.topbar-actions { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 42px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--olive-500); }
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--clay-500);
  border-color: var(--clay-500);
  color: #FFF8F0;
}
.btn-primary:hover { background: var(--clay-600); border-color: var(--clay-600); }
.btn-ghost {
  border-color: transparent;
  background: transparent;
}
.btn-ghost:hover { background: var(--olive-50); border-color: transparent; }
.btn-danger {
  color: var(--danger);
  border-color: var(--line-strong);
  background: var(--paper);
}
.btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-icon { width: 42px; height: 42px; padding: 0; justify-content: center; }

/* ---- Layout ---- */
.layout {
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
  padding: 28px 24px 80px;
  display: grid;
  grid-template-columns: 250px 1fr;
  gap: 32px;
  flex: 1;
}
@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; }
}

/* ---- Filters sidebar ---- */
.filters {
  align-self: start;
  position: sticky;
  top: 90px;
  max-height: calc(100vh - 110px);
  overflow-y: auto;
  padding-right: 6px;
}
@media (max-width: 880px) {
  .filters { position: static; }
}
.filter-group { margin-bottom: 26px; }
.filter-group h3 {
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  margin-bottom: 12px;
}
.filter-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  font-size: 13px;
  color: var(--ink-soft);
  transition: all .12s ease;
  user-select: none;
}
.chip:hover { border-color: var(--olive-500); color: var(--ink); }
.chip.active {
  background: var(--olive-500);
  border-color: var(--olive-500);
  color: var(--cream);
}
.chip .count { font-size: 11px; opacity: 0.75; }
.filter-list { display: flex; flex-direction: column; gap: 2px; }
.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--ink-soft);
  transition: background .12s ease, color .12s ease;
}
.filter-row:hover { background: var(--olive-50); color: var(--ink); }
.filter-row.active { background: var(--olive-100); color: var(--olive-900); font-weight: 500; }
:root[data-theme="dark"] .filter-row.active,
[data-theme="dark"] .filter-row.active { color: var(--ink); }
.filter-row .count { font-size: 12px; color: var(--ink-faint); }
.range-row { padding: 4px 10px 8px; }
.range-row input[type=range] {
  width: 100%;
  accent-color: var(--olive-500);
}
.range-row .range-label {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 2px;
}
.clear-filters {
  font-size: 12.5px;
  color: var(--clay-500);
  margin-top: 4px;
  display: none;
}
.clear-filters.show { display: inline-block; }

/* ---- Recipe grid ---- */
.results-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}
.results-count { font-size: 14px; color: var(--ink-soft); }
.sort-select {
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  padding: 0 10px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s ease, transform .12s ease;
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--olive-500); transform: translateY(-2px); }
.card-media {
  height: 132px;
  background: linear-gradient(135deg, var(--olive-100), var(--cream-dim));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.card-media .emoji { font-size: 40px; opacity: 0.55; }
.card-fav {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  color: var(--ink-faint);
}
:root[data-theme="dark"] .card-fav, [data-theme="dark"] .card-fav { background: rgba(0,0,0,0.5); }
.card-fav.is-fav { color: var(--clay-500); }
.card-fav svg { width: 16px; height: 16px; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 16.5px; font-family: var(--font-display); font-weight: 500; line-height: 1.25; }
.card-desc {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12.5px;
  color: var(--ink-faint);
  margin-top: auto;
  padding-top: 6px;
}
.card-meta span { display: flex; align-items: center; gap: 4px; }
.card-meta svg { width: 13px; height: 13px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--olive-50);
  color: var(--olive-700);
  font-weight: 500;
}
:root[data-theme="dark"] .tag, [data-theme="dark"] .tag { color: var(--olive-300); }

.difficulty-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.diff-makkelijk { background: var(--success); }
.diff-gemiddeld { background: var(--clay-400); }
.diff-moeilijk { background: var(--danger); }
.diff-gevorderd { background: var(--ink); }

/* ---- Empty state ---- */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-soft);
}
.empty-state .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.5; }
.empty-state h3 { font-size: 18px; margin-bottom: 6px; color: var(--ink); }
.empty-state p { font-size: 14px; margin-bottom: 20px; }

/* ---- Modal shell ---- */
.modal-scrim {
  position: fixed;
  inset: 0;
  background: rgba(38, 34, 26, 0.5);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 100;
  padding: 40px 16px;
  overflow-y: auto;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--cream);
  border-radius: var(--radius-lg);
  max-width: 760px;
  width: 100%;
  margin: auto;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.25);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
}
.modal-header h2 { font-size: 18px; }
.modal-body { padding: 24px; max-height: 76vh; overflow-y: auto; }
.close-x {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
}
.close-x:hover { background: var(--olive-50); }
.close-x svg { width: 18px; height: 18px; }

/* ---- Recipe detail ---- */
.detail-hero { padding: 6px 24px 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
.detail-title { font-size: 26px; margin-bottom: 8px; }
.detail-desc { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.5; }
.detail-meta-row { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
.detail-meta-row span { display: flex; align-items: center; gap: 5px; }
.detail-meta-row svg { width: 14px; height: 14px; }
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.detail-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  margin: 28px 0 12px;
}
.section-title:first-child { margin-top: 0; }

.scaler {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--olive-50);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 16px;
}
.scaler-label { font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
.scaler-controls { display: flex; align-items: center; gap: 10px; flex: 1; }
.stepper-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--ink);
  flex-shrink: 0;
}
.stepper-btn:hover { border-color: var(--olive-500); }
.scaler-value { font-weight: 600; font-size: 15px; min-width: 20px; text-align: center; }
.scaler input[type=range] { flex: 1; accent-color: var(--clay-500); }

.ingredient-list { display: flex; flex-direction: column; }
.ingredient-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}
.ingredient-row:last-child { border-bottom: none; }
.ingredient-amt { font-weight: 600; min-width: 78px; color: var(--olive-700); }
:root[data-theme="dark"] .ingredient-amt, [data-theme="dark"] .ingredient-amt { color: var(--olive-300); }
.ingredient-name { color: var(--ink); }

.step-list { display: flex; flex-direction: column; gap: 4px; }
.step-row { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.step-row:last-child { border-bottom: none; }
.step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--olive-500);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.step-content { flex: 1; }
.step-title { font-weight: 500; font-size: 14.5px; margin-bottom: 3px; }
.step-text { font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
.step-text b { color: var(--olive-700); font-weight: 600; }
:root[data-theme="dark"] .step-text b, [data-theme="dark"] .step-text b { color: var(--olive-300); }
.step-timer {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--clay-500);
  margin-top: 6px;
  font-weight: 500;
}
.step-timer svg { width: 13px; height: 13px; }

.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.macro-card {
  background: var(--olive-50);
  border-radius: var(--radius-md);
  padding: 12px;
  text-align: center;
}
.macro-value { font-size: 19px; font-weight: 600; font-family: var(--font-display); }
.macro-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
.macro-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  margin-top: 10px;
  font-weight: 500;
}
.macro-badge.geschat { background: var(--cream-dim); color: var(--ink-faint); }
.macro-badge.opgegeven { background: var(--success-bg); color: var(--success); }
.macro-badge.handmatig { background: var(--olive-100); color: var(--olive-700); }
:root[data-theme="dark"] .macro-badge.handmatig, [data-theme="dark"] .macro-badge.handmatig { color: var(--olive-300); }

.notes-list { display: flex; flex-direction: column; gap: 8px; }
.note-item {
  background: var(--olive-50);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13.5px;
}
.note-date { color: var(--ink-faint); font-size: 11.5px; margin-bottom: 3px; }

.version-list { display: flex; flex-direction: column; gap: 2px; }
.version-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
.version-row:last-child { border-bottom: none; }
.version-num {
  font-weight: 600;
  color: var(--olive-700);
  min-width: 50px;
}
:root[data-theme="dark"] .version-num, [data-theme="dark"] .version-num { color: var(--olive-300); }
.version-date { color: var(--ink-faint); font-size: 12px; min-width: 90px; }
.version-desc { flex: 1; color: var(--ink-soft); }
.version-revert {
  font-size: 12px;
  color: var(--clay-500);
  background: none;
  border: none;
  padding: 2px 6px;
  flex-shrink: 0;
}
.version-revert:hover { text-decoration: underline; }

.manual-edit-toggle {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.manual-edit-toggle:hover { color: var(--ink); }
.manual-edit-toggle svg { width: 14px; height: 14px; }

.field-label { font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; display: block; }
.field-input, .field-textarea, .field-select {
  width: 100%;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
  padding: 9px 12px;
  font-size: 14px;
  outline: none;
}
.field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--olive-500); }
.field-row { margin-bottom: 14px; }
.field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--olive-900);
  color: var(--cream);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

.upload-drop {
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius-md);
  padding: 28px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 13.5px;
  margin-bottom: 16px;
  background: var(--cream-dim);
}
.upload-drop svg { width: 26px; height: 26px; margin-bottom: 8px; color: var(--ink-faint); }
.upload-drop strong { color: var(--ink); }

.tab-row { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab-btn {
  padding: 10px 4px;
  margin-right: 20px;
  font-size: 14px;
  color: var(--ink-faint);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-weight: 500;
}
.tab-btn.active { color: var(--ink); border-bottom-color: var(--clay-500); }

.dynamic-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.dynamic-row .field-input { flex: 1; }
.remove-row-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--paper);

    return (s||"recept").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40) || "recept";
  }
  function esc(s){
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  // Data komt soms binnen via de chat/skills i.p.v. de app, en een los veld als
  // stijl_tags kan daar per ongeluk als komma-gescheiden string i.p.v. array
  // terechtkomen. Elke plek die .map/.some/.filter/.join op zo'n veld aanroept
  // gebruikt daarom asTagArray() i.p.v. rechtstreeks (x.veld||[]) — anders crasht
  // een enkel fout document de hele tab-render zonder zichtbare foutmelding.
  function asTagArray(v){
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.trim()) return v.split(",").map(x => x.trim()).filter(Boolean);
    return [];
  }
  // Lichte markdown-renderer voor lange vrije-tekstvelden (bv. techniek-inhoud).
  // Bewust beperkt: koppen (#/##/###), vet (**x**), cursief (*x*), bullet- en
  // genummerde lijsten, en alinea's op basis van lege regels. Alle tekst wordt
  // eerst ge-esc()-t, dus dit is veilig tegen HTML/script-injectie — er wordt
  // nooit ruwe input als HTML doorgelaten, enkel de vaste tags hieronder.
  function renderLightMarkdown(raw){
    if (!raw) return "";
    const lines = String(raw).replace(/\r\n/g, "\n").split("\n");
    let html = "";
    let listType = null; // "ul" | "ol" | null
    let para = [];
    function inline(s){
      s = esc(s);
      s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      s = s.replace(/(^|[^*])\*(?!\*)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>");
      return s;
    }
    function flushPara(){
      if (para.length){
        html += `<p style="margin:0 0 12px;">${para.map(inline).join("<br>")}</p>`;
        para = [];
      }
    }
    function closeList(){
      if (listType){ html += listType === "ul" ? "</ul>" : "</ol>"; listType = null; }
    }
    for (const rawLine of lines){
      const line = rawLine.trim();
      const heading = line.match(/^(#{1,3})\s+(.*)$/);
      const bullet = line.match(/^[-*]\s+(.*)$/);
      const numbered = line.match(/^\d+[.)]\s+(.*)$/);
      if (heading){
        flushPara(); closeList();
        const level = heading[1].length; // 1,2,3
        const tag = level === 1 ? "h3" : level === 2 ? "h4" : "h5";
        const cls = level === 1 ? "md-h1" : level === 2 ? "md-h2" : "md-h3";
        html += `<${tag} class="${cls}">${inline(heading[2])}</${tag}>`;
      } else if (bullet){
        flushPara();
        if (listType !== "ul"){ closeList(); html += '<ul style="margin:0 0 12px; padding-left:22px;">'; listType = "ul"; }
        html += `<li style="margin-bottom:4px;">${inline(bullet[1])}</li>`;
      } else if (numbered){
        flushPara();
        if (listType !== "ol"){ closeList(); html += '<ol style="margin:0 0 12px; padding-left:22px;">'; listType = "ol"; }
        html += `<li style="margin-bottom:4px;">${inline(numbered[1])}</li>`;
      } else if (line === ""){
        flushPara(); closeList();
      } else {
        para.push(line);
      }
    }
    flushPara(); closeList();
    return html;
  }

  // opgeslagen dan de vaste dropdown-opties (bv. "vegetarisch" vs "Vegetarisch"). Vergelijk
  // daarom altijd case-insensitive, en toon een tag altijd genormaliseerd (kleine letter,
  // eerste letter hoofdletter) ongeacht hoe hij is opgeslagen.
  function ciEquals(a, b){
    if (a === null || a === undefined || b === null || b === undefined) return false;
    return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }
  function ciIncludes(arr, value){
    if (!arr || !value) return false;
    return asTagArray(arr).some(x => ciEquals(x, value));
  }

            </div>
          </div>
        </div>`;
      document.body.appendChild(scrim);
      function cleanup(result){
        document.body.removeChild(scrim);
        resolve(result);
      }
      scrim.querySelector("#__confirm-cancel").addEventListener("click", () => cleanup(false));
      scrim.querySelector("#__confirm-ok").addEventListener("click", () => cleanup(true));
      scrim.addEventListener("click", (e) => { if (e.target === scrim) cleanup(false); });
    });
  }

  const COL_DEFAULTS = { extra: {}, items: [], techniek_ids: [], gerelateerde_recept_ids: [] };
  const DB_ONLY = { created_at: 1, updated_at: 1 };

  // rij (database) -> document (zoals de app het kent)
  function fromRow(row){
    const doc = {};
    Object.keys(row).forEach(k => {
      if (k === "extra" || DB_ONLY[k]) return;
      if (row[k] !== null) doc[k] = row[k];
    });
    return Object.assign(doc, row.extra || {});
  }
  // document -> rij: bekende velden naar kolommen, de rest in `extra` (niets gaat verloren)
  function toRow(table, doc){
    const cols = TABLE_COLS[table];
    const row = {}, extra = {};
    Object.keys(doc).forEach(k => {
      if (DB_ONLY[k]) return;
      if (cols.indexOf(k) >= 0) row[k] = doc[k]; else extra[k] = doc[k];
    });
    cols.forEach(c => {
      if (row[c] === undefined || (row[c] === null && c in COL_DEFAULTS)) row[c] = (c in COL_DEFAULTS) ? COL_DEFAULTS[c] : null;
    });
    row.extra = extra;
    return row;
  }

  const COLLECTIONS = [
    ["recepten", (items) => { state.recipes = items; }],
    ["dranken", (items) => { state.drinks = items; }],
    ["puur", (items) => { state.puurDranken = items; }],
    ["menus", (items) => { state.menus = items; }],
    ["pairings", (items) => { state.pairings = items; }],
    ["voorraad_ingredienten", (items) => { state.voorraadIngredienten = items; }],
    ["voorraad_flessen", (items) => { state.voorraadFlessen = items; }],
    ["voorraad_materiaal", (items) => { state.voorraadMateriaal = items; }],
    ["planning", (items) => { state.planningItems = items; }],
    ["versielog", (items) => { state.versielogItems = items; }],
    ["kruidenmixen", (items) => { state.kruidenmixen = items; }],
    ["sauzen", (items) => { state.sauzen = items; }],
    ["kookboeken", (items) => { state.kookboeken = items; }],
    ["dessertbasis", (items) => { state.dessertbasis = items; }],
    ["technieken", (items) => { state.technieken = items; }],
    ["naslagwerken", (items) => { state.naslagwerken = items; }]
  ];
  const cache = {};
  function setterFor(name){ return COLLECTIONS.find(c => c[0] === name)[1]; }

  async function fetchCollection(table){
    const out = [], PAGE = 1000;
    for (let from = 0; ; from += PAGE){
      const { data, error } = await sb.from(table).select("*").order("id").range(from, from + PAGE - 1);
      if (error) throw new Error("'" + table + "': " + error.message);
      data.forEach(r => out.push(fromRow(r)));
      if (data.length < PAGE) break;
    }
    return out;
  }

  let lastLoad = 0;
  async function loadAll(){
    state.loading = true; state.loadError = null; render();
    try {
      await Promise.all(COLLECTIONS.map(async ([name, set]) => {
        cache[name] = await fetchCollection(name);
        set(cache[name]);
      }));
      lastLoad = Date.now();
    } catch(e){
      state.loadError = "Fout bij ophalen van gegevens: " + (e && e.message ? e.message : String(e));
      COLLECTIONS.forEach(([name, set]) => { if (!cache[name]) set([]); });
    }
    state.loading = false;
    render();
  }

  // Stil verversen (bv. als je terugkeert naar het tabblad): enkel renderen als er iets veranderd is.
  async function refreshQuietly(){
    if (!state.session || !state.role || state.loading) return;
    try {
      let changed = false;
      for (const [name, set] of COLLECTIONS){
        const fresh = await fetchCollection(name);
        if (JSON.stringify(fresh) !== JSON.stringify(cache[name])){ cache[name] = fresh; set(fresh); changed = true; }
      }
      lastLoad = Date.now();
      if (changed) render();
    } catch(e){ /* stil: de volgende keer opnieuw */ }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 60000) refreshQuietly();
  });

  async function loadRecipes(){ await loadAll(); }

  async function saveToCollection(collectionName, item){
    if (!canWrite()) throw new Error("Je hebt geen schrijfrechten (rol: " + (state.role || "geen") + ")");
    const { error } = await sb.from(collectionName).upsert(toRow(collectionName, item), { onConflict: "id" });
    if (error) throw new Error(error.message);
    const list = cache[collectionName] || (cache[collectionName] = []);
    const copy = JSON.parse(JSON.stringify(item));
    const i = list.findIndex(x => x.id === item.id);
    if (i >= 0) list[i] = copy; else list.push(copy);
    setterFor(collectionName)(list.slice());
    render();
  }
  async function deleteFromCollection(collectionName, id){
    if (!canDelete()) throw new Error("Enkel een admin mag verwijderen (jouw rol: " + (state.role || "geen") + ")");
    const { error, count } = await sb.from(collectionName).delete({ count: "exact" }).eq("id", id);
    if (error) throw new Error(error.message);
    if (count === 0) throw new Error("Niet verwijderd (geen rechten, of bestond al niet meer)");
    cache[collectionName] = (cache[collectionName] || []).filter(x => x.id !== id);
    setterFor(collectionName)(cache[collectionName].slice());
    render();
  }

  // ---------- Login / registratie / rollen ----------
  const ROLLEN = { viewer: "Viewer (lezen)", contributor: "Contributor (lezen + toevoegen/wijzigen)", admin: "Admin (alles + beheer)" };

  function attachLoginHandlers(){

    form.addEventListener("submit", async (e) => {

      const password = document.getElementById("login-password").value;
      btn.disabled = true; btn.textContent = "Bezig...";
      if (state.loginMode === "aanvragen"){
        if (password !== document.getElementById("login-password2").value){
          state.loginError = "De twee wachtwoorden zijn niet gelijk."; state.loginInfo = null; render(); return;
        }
        const { error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error){ state.loginError = "Aanvraag mislukt: " + error.message; state.loginInfo = null; render(); return; }
        state.loginError = null;
        state.loginInfo = "Bijna klaar. We stuurden een bevestigingsmail naar " + email + ". Klik op de link in die mail (kijk ook in je spam). Daarna beoordeelt de beheerder je aanvraag.";

        render();
        return;
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error){
        state.loginError = "Inloggen mislukt: " + error.message; state.loginInfo = null;
        render();
        return;
      }
      state.loginError = null; state.loginInfo = null;
      state.session = data.session;
      startApp();
    });

  async function loadRole(){
    const uid = state.session && state.session.user && state.session.user.id;
    if (!uid){ state.role = null; state.roleLoaded = true; return; }
    const { data, error } = await sb.from("app_users").select("role").eq("user_id", uid).maybeSingle();
    state.role = (!error && data) ? data.role : null;
    state.roleError = error ? error.message : null;
    state.roleLoaded = true;
  }
  async function startApp(){
    if (state.started) return;
    state.started = true;
    await loadRole();
    if (state.role) await loadAll(); else render();
  }
  async function initAuth(){
    const { data } = await sb.auth.getSession();
    state.session = data.session;
    state.authChecked = true;
    sb.auth.onAuthStateChange((_event, session) => {
      const had = !!state.session;
      state.session = session;
      if (had && !session){
        state.role = null; state.roleLoaded = false; state.started = false;
        render();
      } else if (!had && session && !state.started){
        setTimeout(startApp, 0);
      }
    });
    if (state.session) startApp(); else render();
  }
  async function logout(){
    await sb.auth.signOut();
    state.session = null; state.role = null; state.roleLoaded = false; state.started = false;
    Object.keys(cache).forEach(k => delete cache[k]);
    render();
  }

  // ---------- Beheer (admin): aanvragen goedkeuren, rollen wijzigen ----------
  function beheerFout(err){
    const m = (err && err.message) || String(err);
    if (m.indexOf("laatste_admin") >= 0) return "Er moet minstens één admin overblijven.";
    if (m.indexOf("geen_rechten") >= 0) return "Je hebt hier geen rechten voor.";
    if (m.indexOf("heeft_al_een_rol") >= 0) return "Deze persoon heeft al een rol.";

  async function openBeheer(){
    const scrim = document.createElement("div");
    scrim.className = "modal-scrim open";
    scrim.style.zIndex = "250";
    document.body.appendChild(scrim);
    const me = state.session.user.id;

    const rolSelect = (id, cur, extra) => `<select data-rol-for="${esc(id)}" ${extra || ""} style="padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px; font:inherit;">${Object.keys(ROLLEN).map(r => `<option value="${r}" ${r === cur ? "selected" : ""}>${esc(ROLLEN[r])}</option>`).join("")}</select>`;

  // ============================================================
  // SHARED — kookboek-item-registry. Cross-domein: elk domein dat
  // in "Mijn kookboeken" opneembaar moet zijn, komt hier 1 regel
  // bij (en heeft zelf een get*(id)-functie hierboven).
  // ============================================================
  const KOOKBOEK_ITEM_TYPES = [
    {type: "recept", label: "Recepten", emoji: "🍽️", get: (id) => getRecipe(id), naam: (x) => x.titel},
    {type: "drank", label: "Cocktails & mixdranken", emoji: "🍸", get: (id) => getDrink(id), naam: (x) => x.naam},
    {type: "kruidenmix", label: "Kruidenmixen", emoji: "🌿", get: (id) => getKruidenmix(id), naam: (x) => x.naam},
    {type: "saus", label: "Sauzen & basisproducten", emoji: "🫙", get: (id) => getSaus(id), naam: (x) => x.naam},
    {type: "dessertbasis", label: "Basisbereidingen dessert", emoji: "🍰", get: (id) => getDessertbasis(id), naam: (x) => x.naam}
  ];
  function kookboekTypeInfo(type){
    return KOOKBOEK_ITEM_TYPES.find(t => t.type === type) || KOOKBOEK_ITEM_TYPES[0];
  }
  function getKookboekItems(kb){
    // Migratie: oude kookboeken gebruikten recept_ids (enkel recepten, geen type).
    const items = kb.items ? kb.items.slice() : (kb.recept_ids || []).map(id => ({id, type: "recept"}));
    return items.map(it => {
      const info = kookboekTypeInfo(it.type);
      const obj = info.get(it.id);
      return obj ? {id: it.id, type: it.type, obj, info} : null;
    }).filter(Boolean);
  }
  function kookboekHasItem(kb, id, type){
    const items = kb.items ? kb.items : (kb.recept_ids || []).map(rid => ({id: rid, type: "recept"}));
    return items.some(it => it.id === id && it.type === type);
  }

  // ============================================================
  // DRANKEN — cocktails & mixdranken.
  // ============================================================

  function allDrinkTags(){
    const set = new Set();
    state.drinks.forEach(d => asTagArray(d.stijl_tags).forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  function filteredDrinks(){
    let list = state.drinks.slice();
    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(d => {
        const inNaam = (d.naam||"").toLowerCase().includes(q);
        const inDesc = (d.beschrijving||"").toLowerCase().includes(q);
        const inTags = asTagArray(d.stijl_tags).some(t => t.toLowerCase().includes(q));
        const inIngr = (d.ingredienten||[]).some(i => (i.naam||"").toLowerCase().includes(q));
        return inNaam || inDesc || inTags || inIngr;
      });
    }
    if (state.drinkFilters.tags.length){
      list = list.filter(d => state.drinkFilters.tags.every(t => ciIncludes(d.stijl_tags, t)));
    }
    if (state.drinkFilters.difficulty){
      list = list.filter(d => ciEquals(d.moeilijkheid, state.drinkFilters.difficulty));
    }
    if (state.drinkFilters.drankType){
      list = list.filter(d => ciEquals(d.drank_type, state.drinkFilters.drankType));
    }
    if (state.drinkFilters.alcoholisch !== null){
      list = list.filter(d => !!d.alcoholisch === state.drinkFilters.alcoholisch);
    }
    if (state.drinkFilters.favoritenOnly){
      list = list.filter(d => !!d.favoriet);
    }
    if (state.drinkFilters.hoofdingredienten.length){
      list = list.filter(d => state.drinkFilters.hoofdingredienten.every(h => ciIncludes(d.hoofdingredienten, h)));
    }
    return list;
  }

  function drinkScaleFactor(drink){
    const current = state.scaleGlasses[drink.id] || drink.basis_glazen || 1;
    return current / (drink.basis_glazen || 1);
  }
  function drinkScaledAmount(drink, amount){
    const f = drinkScaleFactor(drink);
    const v = amount * f;
    if (Math.abs(v - Math.round(v)) < 0.05) return Math.round(v);
    return Math.round(v * 10) / 10;
  }

        <div class="section-title">Ingrediënten</div>
        <div class="ingredient-list">
          ${(d.ingredienten||[]).map(i => `
            <div class="ingredient-row" style="flex-direction:column; align-items:stretch;">
              <div style="display:flex; align-items:center; gap:12px;">

              ${renderGekoppeldPreview(i)}

  function renderDrinkStepText(text, drink){
    if (!text) return "";
    return esc(text).replace(/\{(\w+)\}/g, (m, id) => {

      if (!ing) return m;
      const amt = fmtNum(drinkScaledAmount(drink, ing.hoeveelheid), 1);
      return `<b>${amt}${ing.eenheid?' '+esc(ing.eenheid):''} ${esc(ing.naam)}</b>`;
    });
  }

        const d = getDrink(state.activeDrinkId);
        editDrinkIngredients = (d.ingredienten||[]).map(i => ({id: i.id, naam: i.naam, hoeveelheid: i.hoeveelheid, eenheid: i.eenheid||"", gekoppeld_item_id: i.gekoppeld_item_id||null, gekoppeld_type: i.gekoppeld_type||null}));
        if (editDrinkIngredients.length === 0) editDrinkIngredients.push({id: uid("ing").slice(0,8), naam:"", hoeveelheid:"", eenheid:""});
        editDrinkSteps = (d.stappen||[]).map(s => ({id: s.id, titel: s.titel, inhoud: s.inhoud, timer: s.timer_seconden ? Math.round(s.timer_seconden/60) : ""}));
        if (editDrinkSteps.length === 0) editDrinkSteps.push({id: "s"+(Date.now()%100000), titel:"", inhoud:"", timer:""});
      }
      render();
      if (state.drinkManualEditOpen) attachDrinkManualEditDynamicHandlers();

      const newVersionNum = Math.max(...(d.versies||[{versienummer:0}]).map(v=>v.versienummer)) + 1;
      const bewerkt = Object.assign({}, d);
      bewerkt.naam = $("#edit-drink-naam").value.trim() || d.naam;
      bewerkt.beschrijving = $("#edit-drink-beschrijving").value.trim();
      bewerkt.bron = readBronFields("edit-drink", d.bron);
      bewerkt.moeilijkheid = $("#edit-drink-moeilijkheid").value;
      bewerkt.bereidingstijd_minuten = parseInt($("#edit-drink-tijd").value) || d.bereidingstijd_minuten;
      bewerkt.basis_glazen = parseInt($("#edit-drink-basisglazen").value) || d.basis_glazen;
      bewerkt.drank_type = $("#edit-drink-type").value.trim() || null;
      bewerkt.alcoholisch = $("#edit-drink-alcoholisch").checked;
      bewerkt.glaswerk = $("#edit-drink-glaswerk").value.trim() || null;
      bewerkt.garnering = $("#edit-drink-garnering").value.trim() || null;
      bewerkt.hoofdingredienten = Array.from($("#edit-drink-hoofdingredienten").selectedOptions).map(o=>o.value);
      bewerkt.stijl_tags = $("#edit-drink-tags").value.split(",").map(t=>t.trim()).filter(Boolean);
      bewerkt.ingredienten = editDrinkIngredients.filter(i=>i.naam.trim()).map(i => ({
        id: i.id, naam: i.naam.trim(), hoeveelheid: parseFloat(i.hoeveelheid)||0, eenheid: i.eenheid.trim()||null,
        gekoppeld_item_id: i.gekoppeld_item_id||null, gekoppeld_type: i.gekoppeld_type||null
      }));
      bewerkt.stappen = editDrinkSteps.filter(s=>s.inhoud.trim()).map((s,idx) => ({
        id: s.id, titel: s.titel.trim()||("Stap "+(idx+1)), inhoud: s.inhoud.trim(),
        timer_seconden: s.timer ? parseInt(s.timer)*60 : null
      }));
      bewerkt.versies = (d.versies||[]).concat([{
        versienummer: newVersionNum,
        datum: todayISO(),
        wijziging_omschrijving: "Handmatig bewerkt",
        snapshot: snapshot
      }]);
      await saveDrink(bewerkt);
      showToast("Opgeslagen als nieuwe versie v"+newVersionNum);
      state.drinkManualEditOpen = false;
      render();
    });

    const saveDrinkNoteOnly = $("#save-drink-note-only");

      showToast("Notitie toegevoegd");
      render();
    });

  }

      <div style="margin-top:4px; padding:8px 10px; background:var(--olive-50); border-radius:var(--radius-sm); font-size:12px;" data-goto-basis="${ing.gekoppeld_type}:${bron.id}">
        <span style="cursor:pointer; color:var(--olive-700); text-decoration:underline;">${esc(bron.naam)}</span>
        ${topIngredienten ? ` — ${esc(topIngredienten)}${(bron.ingredienten||[]).length>3?'...':''}` : ''}
        <span style="color:var(--ink-faint);"> · uit ${basisTypeLabel(ing.gekoppeld_type)}</span>
      </div>`;
  }

  function renderBronBadge(bron){
    if (!bron || (!bron.referentie && !bron.type)) return "";
    const typeLabel = {"handmatig":"Handmatig ingevoerd","foto":"Uit foto","screenshot":"Uit screenshot","pdf":"Uit PDF","tekst":"Uit tekst","video-analyse":"Uit video","boek":"Uit boek"}[bron.type] || bron.type;
    return `
      <div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:12px;">
        📎 ${esc(typeLabel)}${bron.referentie ? `: ${esc(bron.referentie)}` : ''}
      </div>`;
  }

  // ---------- Derived data ----------
  function getRecipe(id){ return state.recipes.find(r => r.id === id); }
  function getPuur(id){ return state.puurDranken.find(x => x.id === id); }
  function getAnyDrinkable(id){ return getRecipe(id) || getDrink(id) || getPuur(id); }

  function allTags(){
    const set = new Set();
    state.recipes.forEach(r => asTagArray(r.stijl_tags).forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  function filteredRecipes(){
    let list = state.recipes.slice();
    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(r => {
        const inTitle = (r.titel||"").toLowerCase().includes(q);
        const inDesc = (r.beschrijving||"").toLowerCase().includes(q);
        const inTags = asTagArray(r.stijl_tags).some(t => t.toLowerCase().includes(q));
        const inIngr = (r.ingredienten||[]).some(i => (i.naam||"").toLowerCase().includes(q));
        return inTitle || inDesc || inTags || inIngr;
      });
    }
    if (state.filters.tags.length){
      list = list.filter(r => state.filters.tags.every(t => ciIncludes(r.stijl_tags, t)));
    }
    if (state.filters.difficulty){
      list = list.filter(r => ciEquals(r.moeilijkheid, state.filters.difficulty));
    }
    if (state.filters.maxTime){
      list = list.filter(r => (r.totale_tijd_minuten||9999) <= state.filters.maxTime);
    }
    if (state.filters.favoritenOnly){
      list = list.filter(r => !!r.favoriet);
    }
    if (state.filters.gangType){
      list = list.filter(r => ciEquals(r.gang_type, state.filters.gangType));
    }
    if (state.filters.eiwitbron){
      list = list.filter(r => ciIncludes(r.eiwitbron, state.filters.eiwitbron));
    }
    if (state.filters.dieet){
      list = list.filter(r => ciIncludes(r.dieet, state.filters.dieet));
    }
    if (state.filters.seizoen){
      list = list.filter(r => ciIncludes(r.seizoen, state.filters.seizoen));
    }
    if (state.filters.gelegenheid){
      list = list.filter(r => ciIncludes(r.gelegenheid, state.filters.gelegenheid));
    }
    if (state.filters.bereidingswijze){
      list = list.filter(r => ciIncludes(r.bereidingswijze, state.filters.bereidingswijze));
    }
    if (state.sort === "recent"){
      list.sort((a,b) => new Date(b.bron?.toegevoegd_op||0) - new Date(a.bron?.toegevoegd_op||0));
    } else if (state.sort === "titel"){
      list.sort((a,b) => (a.titel||"").localeCompare(b.titel||""));
    } else if (state.sort === "tijd"){
      list.sort((a,b) => (a.totale_tijd_minuten||0) - (b.totale_tijd_minuten||0));
    } else if (state.sort === "moeilijkheid"){
      const order = {makkelijk:0, gemiddeld:1, moeilijk:2, gevorderd:3};
      list.sort((a,b) => (order[a.moeilijkheid]??1) - (order[b.moeilijkheid]??1));
    }
    return list;
  }

  function scaleFactor(recipe){
    const current = state.scalePortions[recipe.id] || recipe.basis_porties || 1;
    return current / (recipe.basis_porties || 1);
  }

  function scaledAmount(recipe, amount){
    const f = scaleFactor(recipe);
    const v = amount * f;
    if (Math.abs(v - Math.round(v)) < 0.05) return Math.round(v);
    return Math.round(v * 10) / 10;
  }

  // ---------- Router ----------
  function goTo(view, recipeId){
    state.view = view;
    state.activeRecipeId = recipeId || null;
    state.manualEditOpen = false;
    if (view !== "add") state.koppelVoorraadFlesId = null;
    render();
    window.scrollTo({top:0});
  }
  function goToPuur(view, puurId){
    state.view = view;
    state.activePuurId = puurId || null;
    state.manualEditOpen = false;
    render();
    window.scrollTo({top:0});
  }
  function goToBasis(view, basisId){
    state.view = view;
    state.activeBasisId = basisId || null;
    state.manualEditOpen = false;
    render();
    window.scrollTo({top:0});
  }
  function goToTechniek(view, techniekId){
    state.view = view;
    state.activeTechniekId = techniekId || null;
    render();
    window.scrollTo({top:0});
  }

  // ---------- Render ----------
  function render(){
    const app = document.getElementById("app");
    if (state.authChecked && !state.session){
      app.innerHTML = renderLogin();
      attachLoginHandlers();
      return;
    }
    if (state.session && !state.roleLoaded){
      app.innerHTML = '<div class="center-loading"><div class="loading-spinner"></div></div>';
      return;
    }
    if (state.session && !state.role){
      app.innerHTML = renderPending();
      attachPendingHandlers();
      return;
    }
    if (state.loading){
      app.innerHTML = '<div class="center-loading"><div class="loading-spinner"></div></div>';
      return;
    }
    app.innerHTML = renderTopbar() + renderMain();
    attachHandlers();
    applyRoleUI();
  }

  function renderTopbar(){
    return `
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">🫒</span>
          <span class="brand-name">Kookboek</span>
        </div>
        <div class="searchbox">
          ${ICONS.search}
          <input id="search-input" type="text" placeholder="Zoek op titel, ingredient, stijl..." value="${esc(state.search)}">
        </div>
        <div class="topbar-actions">
          <button class="btn btn-icon mobile-filter-toggle" id="mobile-filter-btn" aria-label="Filters">${ICONS.filter}</button>
          ${state.activeTab === "eten" ? `<button class="btn btn-primary" id="add-recipe-btn">${ICONS.plus} Recept toevoegen</button>` : ''}
          ${state.activeTab === "drinken" ? `<button class="btn btn-primary" id="add-drink-btn">${ICONS.plus} Drank toevoegen</button>` : ''}
          ${state.activeTab === "puur" ? `<button class="btn btn-primary" id="add-puur-btn">${ICONS.plus} Fles/drank toevoegen</button>` : ''}
          ${state.activeTab === "voorraad" ? `<button class="btn btn-primary" id="add-voorraad-btn">${ICONS.plus} Toevoegen</button><button class="btn" id="print-voorraad-btn" style="margin-left:8px;">🖨️ Afdrukken</button>` : ''}
          ${(state.activeTab === "planning" && state.planningSubTab === "planning") ? `<button class="btn btn-primary" id="add-planning-btn">${ICONS.plus} Idee toevoegen</button>` : ''}
          ${state.activeTab === "basis" ? `<button class="btn btn-primary" id="add-basis-btn">${ICONS.plus} ${basisSubTabLabel(state.basisSubTab)} toevoegen</button>` : ''}
          ${(state.activeTab === "kookboeken" && !state.activeKookboekId) ? `<button class="btn btn-primary" id="add-kookboek-btn">${ICONS.plus} Nieuw kookboek</button>` : ''}
          ${state.activeTab === "technieken" ? `<button class="btn btn-primary" id="add-techniek-btn">${ICONS.plus} Techniek/documentatie toevoegen</button>` : ''}
          ${(state.activeTab === "naslagwerken" && !state.activeNaslagwerkId) ? `<button class="btn btn-primary" id="add-naslagwerk-btn">${ICONS.plus} Nieuw naslagwerk</button>` : ''}
          ${state.role === "admin" ? `<button class="btn btn-sm" id="beheer-btn" style="margin-left:8px;">Beheer</button>` : ''}
          <span style="font-size:12px; color:var(--muted, #777); margin-left:8px;">${esc(state.role || "")}</span>
          <button class="btn btn-sm" id="logout-btn" title="Uitloggen" style="margin-left:8px;">Uitloggen</button>
        </div>
      </div>
      <div class="topbar-inner" style="padding-top:0; padding-bottom:0;">
        <div class="tab-row" style="border-bottom:none; margin-bottom:0;">
          <button class="tab-btn ${state.activeTab==='eten'?'active':''}" data-tab="eten">Eten</button>
          <button class="tab-btn ${state.activeTab==='kookboeken'?'active':''}" data-tab="kookboeken">Mijn kookboeken</button>
          <button class="tab-btn ${state.activeTab==='basis'?'active':''}" data-tab="basis">Kruiden & sauzen</button>
          <button class="tab-btn ${state.activeTab==='drinken'?'active':''}" data-tab="drinken">Cocktails & mixdranken</button>
          <button class="tab-btn ${state.activeTab==='puur'?'active':''}" data-tab="puur">Puur & gedistilleerd</button>
          <button class="tab-btn ${state.activeTab==='menus'?'active':''}" data-tab="menus">Menu's & pairing</button>
          <button class="tab-btn ${state.activeTab==='voorraad'?'active':''}" data-tab="voorraad">Voorraad</button>
          <button class="tab-btn ${state.activeTab==='technieken'?'active':''}" data-tab="technieken">Technieken & documentatie</button>
          <button class="tab-btn ${state.activeTab==='naslagwerken'?'active':''}" data-tab="naslagwerken">Naslagwerken</button>
          <button class="tab-btn ${state.activeTab==='planning'?'active':''}" data-tab="planning">Over & planning</button>
        </div>
      </div>
    </div>`;
  }

  function renderMain(){
    if (state.activeTab === "eten"){
      if (state.view === "detail" && state.activeRecipeId){
        const r = getRecipe(state.activeRecipeId);
        if (!r) { state.view = "grid"; }
        else return `<div class="layout" style="display:block; max-width:820px;">${renderDetail(r)}</div>`;
      }
      return renderGridView() + renderAddModal();
    }
    if (state.activeTab === "drinken"){
      if (state.view === "detail" && state.activeDrinkId){
        const d = getDrink(state.activeDrinkId);
        if (!d) { state.view = "grid"; }
        else return `<div class="layout" style="display:block; max-width:820px;">${renderDrinkDetail(d)}</div>`;
      }
      return renderDrinkGridView() + renderAddDrinkModal();
    }
    if (state.activeTab === "puur"){
      if (state.view === "detail" && state.activePuurId){
        const x = getPuur(state.activePuurId);
        if (!x) { state.view = "grid"; }
        else return `<div class="layout" style="display:block; max-width:820px;">${renderPuurDetail(x)}</div>`;
      }
      return renderPuurGridView() + renderAddPuurModal();
    }
    if (state.activeTab === "basis"){
      if (state.view === "detail" && state.activeBasisId){
        const item = getActiveBasisItem();
        if (!item) { state.view = "grid"; }
        else return `<div class="layout" style="display:block; max-width:820px;">${renderBasisDetail(item)}</div>`;
      }
      return renderBasisGridView() + renderAddBasisModal();
    }
    if (state.activeTab === "kookboeken"){
      if (state.activeKookboekId){
        const kb = getKookboek(state.activeKookboekId);
        if (!kb) { state.activeKookboekId = null; }
        else return `<div class="layout" style="display:block; max-width:1180px;">${renderKookboekDetail(kb)}</div>`;
      }
      return renderKookboekenOverzicht() + renderAddKookboekModal();
    }
    if (state.activeTab === "naslagwerken"){
      if (state.activeNaslagwerkId){
        const nw = getNaslagwerk(state.activeNaslagwerkId);
        if (!nw) { state.activeNaslagwerkId = null; }
        else return `<div class="layout" style="display:block; max-width:1180px;">${renderNaslagwerkDetail(nw)}</div>`;
      }
      return renderNaslagwerkenOverzicht() + renderAddNaslagwerkModal();
    }
    if (state.activeTab === "voorraad"){
      return renderVoorraadView() + renderAddVoorraadModal();
    }
    if (state.activeTab === "planning"){
      return renderPlanningView() + renderAddPlanningModal();
    }
    if (state.activeTab === "menus"){
      return renderMenuPairingView();
    }
    if (state.activeTab === "technieken"){
      if (state.view === "detail" && state.activeTechniekId){
        const t = getTechniek(state.activeTechniekId);
        if (!t) { state.view = "grid"; }
        else return `<div class="layout" style="display:block; max-width:820px;">${renderTechniekDetail(t)}</div>`;
      }
      return renderTechniekenGridView() + renderAddTechniekModal();
    }
    return "";
  }

  function renderGridView(){
    const list = filteredRecipes();
    const tags = allTags();
    const hasFilters = state.filters.tags.length || state.filters.difficulty || state.filters.maxTime || state.filters.favoritenOnly
      || state.filters.gangType || state.filters.eiwitbron || state.filters.dieet || state.filters.seizoen || state.filters.gelegenheid || state.filters.bereidingswijze;
    const selectFilter = (label, filterKey, options) => `
        <div class="filter-group">
          <h3>${label}</h3>
          <select class="field-select" data-cat-filter="${filterKey}">
            <option value="">Alles</option>
            ${options.map(o => `<option value="${esc(o)}" ${state.filters[filterKey]===o?'selected':''}>${esc(o)}</option>`).join("")}
          </select>
        </div>`;
    return `
    <div class="layout">
      <aside class="filters ${state.mobileFiltersOpen ? 'mobile-open':''}">
        <div class="filter-group">
          <h3>Favorieten</h3>
          <div class="filter-list">
            <button class="filter-row ${state.filters.favoritenOnly?'active':''}" data-fav-filter="1">
              <span style="display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;display:inline-flex;">${state.filters.favoritenOnly ? ICONS.heart : ICONS.heartOutline}</span> Alleen favorieten</span>
              <span class="count">${state.recipes.filter(r=>r.favoriet).length}</span>
            </button>
          </div>
        </div>
        ${selectFilter("Gang", "gangType", GANG_TYPES)}
        ${selectFilter("Eiwitbron", "eiwitbron", EIWITBRON_TYPES)}
        ${selectFilter("Dieetvorm", "dieet", DIEET_TYPES)}
        ${selectFilter("Seizoen", "seizoen", SEIZOEN_TYPES)}
        ${selectFilter("Gelegenheid", "gelegenheid", GELEGENHEID_TYPES)}
        ${selectFilter("Bereidingswijze", "bereidingswijze", BEREIDINGSWIJZE_TYPES)}
        <div class="filter-group">
          <h3>Moeilijkheid</h3>
          <div class="filter-list">
            ${MOEILIJKHEID_NIVEAUS.map(d => `
              <button class="filter-row ${state.filters.difficulty===d?'active':''}" data-diff="${d}">
                <span style="display:flex;align-items:center;gap:8px;"><span class="difficulty-dot diff-${d}"></span>${d.charAt(0).toUpperCase()+d.slice(1)}</span>
                <span class="count">${state.recipes.filter(r=>r.moeilijkheid===d).length}</span>
              </button>`).join("")}
          </div>
        </div>
        <div class="filter-group">
          <h3>Max. totale tijd</h3>
          <div class="range-row">
            <input type="range" id="time-range" min="10" max="180" step="10" value="${state.filters.maxTime||180}">
            <div class="range-label"><span>10 min</span><span id="time-range-val">${state.filters.maxTime ? state.filters.maxTime+' min' : 'Alles'}</span></div>
          </div>
        </div>
        ${hasFilters ? `<button class="clear-filters show" id="clear-filters-btn">Filters wissen</button>` : ''}
      </aside>
      <div>
        <div class="results-bar">
          <span class="results-count">${list.length} recept${list.length===1?'':'en'}</span>
          <select class="sort-select" id="sort-select">
            <option value="recent" ${state.sort==='recent'?'selected':''}>Recent toegevoegd</option>
            <option value="titel" ${state.sort==='titel'?'selected':''}>Titel A-Z</option>
            <option value="tijd" ${state.sort==='tijd'?'selected':''}>Kortste bereidingstijd</option>
            <option value="moeilijkheid" ${state.sort==='moeilijkheid'?'selected':''}>Moeilijkheid</option>
          </select>
        </div>
        ${list.length === 0 ? renderEmptyState() : `<div class="grid">${list.map(renderCard).join("")}</div>`}
      </div>
    </div>`;
  }

  function renderEmptyState(){
    const hasAny = state.recipes.length > 0;
    return `
    <div class="empty-state">
      <div class="icon">${hasAny ? "🔍" : "📖"}</div>
      <h3>${hasAny ? "Geen recepten gevonden" : "Je kookboek is nog leeg"}</h3>
      <p>${hasAny ? "Probeer andere filters of een andere zoekterm." : "Voeg je eerste recept toe via tekst, een foto, of een screenshot."}</p>
      ${state.loadError ? `<div style="background:var(--danger-bg); color:var(--danger); border-radius:var(--radius-md); padding:14px 18px; margin:0 auto 16px; max-width:520px; font-size:13px; text-align:left;"><strong>Technisch probleem bij laden:</strong><br>${esc(state.loadError)}</div><button class="btn" id="retry-load-btn" style="margin-bottom:20px;">Opnieuw proberen</button>` : ''}
      ${!hasAny ? `<button class="btn btn-primary" id="empty-add-btn">${ICONS.plus} Eerste recept toevoegen</button>` : ''}
    </div>`;
  }

  function renderCard(r){
    const isFav = !!r.favoriet;
    return `

          <button class="btn btn-sm" id="add-to-kookboek-btn">📖 Toevoegen aan kookboek</button>

          <button class="btn btn-sm btn-danger" id="delete-recipe-btn">${ICONS.trash} Verwijderen</button>
        </div>
        ${state.addToKookboekOpen && state.addToKookboekOpen.type === "recept" && state.addToKookboekOpen.id === r.id ? renderAddToKookboekModal(r, "recept") : ''}
      </div>

            <div class="ingredient-row" style="flex-direction:column; align-items:stretch;">
              <div style="display:flex; align-items:center; gap:12px;">

                <span class="ingredient-name">${esc(i.naam)}</span>
              </div>
              ${renderGekoppeldPreview(i)}
            </div>`).join("") || '<p style="color:var(--ink-faint);font-size:13.5px;">Geen ingrediënten opgegeven.</p>'}
        </div>

        <div class="section-title">Bereiding</div>
        <div class="step-list">
          ${(r.stappen||[]).map((s, idx) => `
            <div class="step-row">
              <div class="step-num">${idx+1}</div>
              <div class="step-content">
                <div class="step-title">${esc(s.titel||'')}</div>
                <div class="step-text">${renderStepText(s.inhoud, r)}</div>

        </div>

  function renderStepText(text, recipe){
    if (!text) return "";
    return esc(text).replace(/\{(\w+)\}/g, (m, id) => {
      const ing = (recipe.ingredienten||[]).find(i => i.id === id);
      if (!ing) return m;
      const amt = fmtNum(scaledAmount(recipe, ing.hoeveelheid), 1);
      return `<b>${amt}${ing.eenheid?' '+esc(ing.eenheid):''} ${esc(ing.naam)}</b>`;
    });
  }

    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      items = items.filter(x => {
        const inNaam = (x.naam||"").toLowerCase().includes(q);
        const inDesc = (x.beschrijving||"").toLowerCase().includes(q);
        const inTags = asTagArray(x.stijl_tags).some(t => t.toLowerCase().includes(q));
        const inIngr = (x.ingredienten||[]).some(i => (i.naam||"").toLowerCase().includes(q));
        return inNaam || inDesc || inTags || inIngr;
      });
    }
    const geenZoekresultaten = items.length === 0 && alleItems.length > 0 && state.search.trim();
    return `

  function basisScaleFactor(item){
    const current = state.scalePortions[item.id] || item.basis_hoeveelheid || 1;
    return current / (item.basis_hoeveelheid || 1);
  }
  function basisScaledAmount(item, amount){
    const f = basisScaleFactor(item);
    const v = amount * f;
    if (Math.abs(v - Math.round(v)) < 0.05) return Math.round(v);
    return Math.round(v * 10) / 10;
  }

  function renderBasisStepText(text, item){
    if (!text) return "";
    return esc(text).replace(/\{(\w+)\}/g, (m, id) => {
      const ing = (item.ingredienten||[]).find(i => i.id === id);
      if (!ing) return m;
      const amt = fmtNum(basisScaledAmount(item, ing.hoeveelheid), 1);
      return `<b>${amt}${ing.eenheid?' '+esc(ing.eenheid):''} ${esc(ing.naam)}</b>`;
    });
  }

  let bmIngredients = [{id: uid("ing"), naam:"", hoeveelheid:"", eenheid:""}];
  let bmSteps = [{id: uid("step"), titel:"", inhoud:"", timer:""}];

  function attachManualAddBasisHandlers(){
    const $ = sel => document.querySelector(sel);
    function renderIngList(){
      $("#bm-ingredients-list").innerHTML = bmIngredients.map(renderManualIngredientRow).join("");
      Array.from(document.querySelectorAll("[data-ing-remove]")).forEach(b => b.addEventListener("click", () => {
        bmIngredients = bmIngredients.filter(i => i.id !== b.getAttribute("data-ing-remove"));
        if (bmIngredients.length === 0) bmIngredients.push({id: uid("ing"), naam:"", hoeveelheid:"", eenheid:""});
        renderIngList();
      }));
      Array.from(document.querySelectorAll("[data-ing-amt]")).forEach(el => el.addEventListener("input", () => {
        const item = bmIngredients.find(i=>i.id===el.getAttribute("data-ing-amt")); if(item) item.hoeveelheid = el.value;
      }));
      Array.from(document.querySelectorAll("[data-ing-unit]")).forEach(el => el.addEventListener("input", () => {
        const item = bmIngredients.find(i=>i.id===el.getAttribute("data-ing-unit")); if(item) item.eenheid = el.value;
      }));
      Array.from(document.querySelectorAll("[data-ing-name]")).forEach(el => el.addEventListener("input", () => {
        const item = bmIngredients.find(i=>i.id===el.getAttribute("data-ing-name")); if(item) item.naam = el.value;
      }));
    }
    function renderStepsList(){
      $("#bm-steps-list").innerHTML = bmSteps.map(renderManualStepRow).join("");
      Array.from(document.querySelectorAll("[data-step-remove]")).forEach(b => b.addEventListener("click", () => {
        bmSteps = bmSteps.filter(s => s.id !== b.getAttribute("data-step-remove"));
        if (bmSteps.length === 0) bmSteps.push({id: uid("step"), titel:"", inhoud:"", timer:""});
        renderStepsList();
      }));
      Array.from(document.querySelectorAll("[data-step-title]")).forEach(el => el.addEventListener("input", () => {
        const item = bmSteps.find(s=>s.id===el.getAttribute("data-step-title")); if(item) item.titel = el.value;
      }));
      Array.from(document.querySelectorAll("[data-step-content]")).forEach(el => el.addEventListener("input", () => {
        const item = bmSteps.find(s=>s.id===el.getAttribute("data-step-content")); if(item) item.inhoud = el.value;
      }));
      Array.from(document.querySelectorAll("[data-step-timer]")).forEach(el => el.addEventListener("input", () => {
        const item = bmSteps.find(s=>s.id===el.getAttribute("data-step-timer")); if(item) item.timer = el.value;
      }));
    }
    renderIngList();
    renderStepsList();
    $("#bm-add-ingredient").addEventListener("click", () => { bmIngredients.push({id: uid("ing"), naam:"", hoeveelheid:"", eenheid:""}); renderIngList(); });
    $("#bm-add-step").addEventListener("click", () => { bmSteps.push({id: uid("step"), titel:"", inhoud:"", timer:""}); renderStepsList(); });

    $("#bm-save-btn").addEventListener("click", async () => {
      const naam = $("#bm-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const tags = $("#bm-tags").value.split(",").map(t=>t.trim()).filter(Boolean);
      const tijd = parseInt($("#bm-tijd").value) || 10;
      const id = basisSubTabIdPrefix(state.basisSubTab) + slugify(naam) + "-" + Math.random().toString(36).slice(2,7);
      const item = {
        id: id,
        naam: naam,
        beschrijving: $("#bm-beschrijving").value.trim(),
        bron: { type: "handmatig", referentie: null, toegevoegd_op: todayISO() },
        stijl_tags: tags,
        bereidingstijd_minuten: tijd,
        houdbaarheid: $("#bm-houdbaarheid").value.trim() || null,
        basis_hoeveelheid: parseFloat($("#bm-basishvh").value) || 1,
        basis_eenheid: $("#bm-basiseenheid").value.trim() || null,
        ingredienten: bmIngredients.filter(i=>i.naam.trim()).map(i => ({
          id: uid("ing").slice(0,8), naam: i.naam.trim(), hoeveelheid: parseFloat(i.hoeveelheid)||0, eenheid: i.eenheid.trim()||null
        })),
        stappen: bmSteps.filter(s=>s.inhoud.trim()).map((s,idx) => ({
          id: "s"+(idx+1), titel: s.titel.trim()||("Stap "+(idx+1)), inhoud: s.inhoud.trim(),
          timer_seconden: s.timer ? parseInt(s.timer)*60 : null
        })),
        macros_per_portie: null,
        notities: [],
        favoriet: false,
        rating: null,
        versies: []
      };
      item.versies = [{ versienummer: 1, datum: todayISO(), wijziging_omschrijving: "Origineel, handmatig ingevoerd", snapshot: Object.assign({}, item) }];
      await saveBasisItem(item);
      bmIngredients = [{id: uid("ing"), naam:"", hoeveelheid:"", eenheid:""}];
      bmSteps = [{id: uid("step"), titel:"", inhoud:"", timer:""}];
      showToast("Toegevoegd");
      goToBasis("detail", id);
    });
  }


  // ---------- Puur & gedistilleerd ----------
  function renderAddPuurModal(){
    if (state.view !== "add") return "";
    return `
    <div class="modal-scrim open" id="add-modal-scrim">
      <div class="modal" style="max-width:560px;">
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;">

            <button class="close-x" id="close-add-modal" aria-label="Sluiten">${ICONS.x}</button>

          <div id="manual-add-puur-form" style="margin-top:4px;">${renderManualAddPuurFields()}</div>
          <div class="upload-drop" style="margin-top:20px;">
            ${ICONS.chef}
            <div style="margin-top:4px; font-size:13px;">Liever een foto van een etiket of wijnkaart laten uitlezen? Stuur die naar Claude in de chat — Claude vult dan ook het smaakprofiel aan en zet het hier klaar.</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function filteredPuur(){
    let list = state.puurDranken.slice();
    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(x => {
        return (x.naam||"").toLowerCase().includes(q) || (x.beschrijving||"").toLowerCase().includes(q)
          || (x.regio||"").toLowerCase().includes(q) || (x.land||"").toLowerCase().includes(q)
          || (x.producent||"").toLowerCase().includes(q);
      });
    }
    if (state.puurFilters.categorie){
      list = list.filter(x => ciEquals(x.categorie, state.puurFilters.categorie));
    }
    if (state.puurFilters.land){
      list = list.filter(x => ciEquals(x.land, state.puurFilters.land));
    }
    if (state.puurFilters.favoritenOnly){
      list = list.filter(x => !!x.favoriet);
    }
    return list;
  }

  function allPuurLanden(){
    const set = new Set();
    state.puurDranken.forEach(x => { if (x.land) set.add(x.land); });
    return Array.from(set).sort();
  }

  function renderPuurGridView(){
    const list = filteredPuur();
    const landen = allPuurLanden();
    const hasFilters = state.puurFilters.categorie || state.puurFilters.land || state.puurFilters.favoritenOnly;
    return `
    <div class="layout">
      <aside class="filters ${state.mobileFiltersOpen ? 'mobile-open':''}">
        <div class="filter-group">
          <h3>Favorieten</h3>
          <div class="filter-list">
            <button class="filter-row ${state.puurFilters.favoritenOnly?'active':''}" data-puur-fav-filter="1">
              <span style="display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;display:inline-flex;">${state.puurFilters.favoritenOnly ? ICONS.heart : ICONS.heartOutline}</span> Alleen favorieten</span>
              <span class="count">${state.puurDranken.filter(x=>x.favoriet).length}</span>
            </button>
          </div>
        </div>
        <div class="filter-group">
          <h3>Categorie</h3>
          <div class="filter-list">
            ${PUUR_CATEGORIEEN.map(c => `
              <button class="filter-row ${state.puurFilters.categorie===c?'active':''}" data-puur-cat-filter="${esc(c)}">
                <span>${esc(c)}</span>
                <span class="count">${state.puurDranken.filter(x=>x.categorie===c).length}</span>
              </button>`).join("")}

        </div>
        ${landen.length ? `
        <div class="filter-group">
          <h3>Land</h3>
          <select class="field-select" id="puur-land-filter">

    const hasAny = state.puurDranken.length > 0;
    return `
    <div class="empty-state">
      <div class="icon">${hasAny ? "🔍" : "🥃"}</div>
      <h3>${hasAny ? "Niets gevonden" : "Nog niets toegevoegd"}</h3>

  const PUUR_EMOJI = {"Whisky":"🥃","Rum":"🥃","Cognac":"🥃","Armagnac":"🥃","Wijn":"🍷","Bier":"🍺","Koffie/thee":"☕","Cider":"🍎","Overig":"🍶"};

  function renderPuurCard(x){
    const isFav = !!x.favoriet;
    return `
    <div class="card" data-open-puur="${x.id}">
      <div class="card-media">
        <button class="card-fav ${isFav?'is-fav':''}" data-puur-fav="${x.id}" aria-label="Favoriet">${isFav ? ICONS.heart : ICONS.heartOutline}</button>

          ${x.alcoholpercentage ? `<span>${fmtNum(x.alcoholpercentage,1)}% alc.</span>` : ''}
          ${x.regio ? `<span>${esc(x.regio)}</span>` : ''}

      </div>

  function renderWijnDegustatie(x){
    const w = x.wijn_degustatie || {};
    const vis = w.visueel || {};
    const olf = w.olfactief || {};
    const gus = w.gustatief || {};
    const con = w.conclusie || {};
    const heeftIets = Object.keys(w).length > 0;
    if (!heeftIets && !w.wijntype) return "";

    const row = (label, value) => value ? `<div style="display:flex; gap:8px; font-size:13.5px; padding:4px 0;"><span style="color:var(--ink-faint); min-width:150px; flex-shrink:0;">${esc(label)}</span><span style="color:var(--ink);">${esc(value)}</span></div>` : '';

    return `
    <div class="section-title">Wijntype</div>
    <div style="margin-bottom:8px;"><span class="tag">${esc(w.wijntype||'Niet opgegeven')}</span></div>

    ${(vis.intensiteit||vis.helderheid||vis.schittering||vis.kleur_nuance||vis.andere) ? `
    <div class="section-title">Visuele fase</div>
    <div style="margin-bottom:8px;">
      ${row("Intensiteit", vis.intensiteit)}
      ${row("Helderheid", vis.helderheid)}
      ${row("Schittering", vis.schittering)}
      ${row("Kleur & nuance", vis.kleur_nuance)}
      ${row("Andere (residu, CO₂...)", vis.andere)}
    </div>` : ''}

    ${(olf.zuiverheid||olf.intensiteit||olf.evolutie||(olf.aromagroepen&&olf.aromagroepen.length)||(olf.concrete_aromas&&olf.concrete_aromas.length)||olf.aard_aromas) ? `
    <div class="section-title">Olfactieve fase</div>
    <div style="margin-bottom:8px;">
      ${row("Zuiverheid", olf.zuiverheid)}
      ${row("Intensiteit", olf.intensiteit)}
      ${row("Evolutie", olf.evolutie)}
      ${(olf.aromagroepen&&olf.aromagroepen.length) ? `<div style="padding:4px 0;"><span style="color:var(--ink-faint); font-size:13.5px;">Aromagroepen: </span>${olf.aromagroepen.map(a=>`<span class="tag" style="margin-right:4px;">${esc(a)}</span>`).join("")}</div>` : ''}
      ${(olf.concrete_aromas&&olf.concrete_aromas.length) ? row("Concrete aroma's", olf.concrete_aromas.join(", ")) : ''}
      ${row("Aard van de aroma's", olf.aard_aromas)}
    </div>` : ''}

    ${(gus.aanzet||gus.middenmond||gus.afdronk) ? `
    <div class="section-title">Gustatieve fase</div>

  function renderVoorraadIngredientenList(){
    const alleItems = state.voorraadIngredienten;

    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      items = items.filter(i => (i.naam||"").toLowerCase().includes(q) || (i.locatie||"").toLowerCase().includes(q));
    }
    if (items.length === 0 && alleItems.length > 0 && state.search.trim()) return `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>Niets gevonden voor "${esc(state.search.trim())}"</h3>
      </div>`;
    if (items.length === 0) return `
      <div class="empty-state">
        <div class="icon">🥫</div>
        <h3>Nog geen ingrediënten in voorraad</h3>
        <p>Houd bij wat je in huis hebt — los van specifieke recepten.</p>
      </div>`;
    return items.map(i => `
      <div style="background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px;">

  async function saveKookboek(item){ await saveToCollection("kookboeken", item); }
  async function deleteKookboek(id){ await deleteFromCollection("kookboeken", id); }
  function getKookboek(id){ return state.kookboeken.find(x => x.id === id); }

  // ---- Hoofdstukken (optionele extra structuur binnen een kookboek) ----
  function getKookboekHoofdstukken(kb){
    return kb.hoofdstukken || [];
  }
  function itemKey(type, id){ return type + ":" + id; }
  function getItemHoofdstukId(kb, type, id){
    const key = itemKey(type, id);
    const h = getKookboekHoofdstukken(kb).find(h => (h.item_keys||[]).includes(key));
    return h ? h.id : null;
  }
  function groupKookboekItemsByHoofdstuk(kb){
    const hoofdstukken = getKookboekHoofdstukken(kb);
    const items = getKookboekItems(kb);
    const groups = hoofdstukken.map(h => ({ hoofdstuk: h, items: [] }));
    const overig = [];
    items.forEach(it => {
      const hid = getItemHoofdstukId(kb, it.type, it.id);
      const group = groups.find(g => g.hoofdstuk.id === hid);
      if (group) group.items.push(it); else overig.push(it);
    });
    return { groups, overig };
  }

  function renderKookboekSearchResults(kb){
    const q = (state.kookboekRecipeSearch||"").toLowerCase().trim();
    if (!q) return "";
    const alleMatches = [];
    KOOKBOEK_ITEM_TYPES.forEach(info => {
      const collection = info.type === "recept" ? state.recipes
        : info.type === "drank" ? state.drinks
        : info.type === "kruidenmix" ? state.kruidenmixen
        : info.type === "saus" ? state.sauzen
        : state.dessertbasis;
      collection.filter(x => info.naam(x).toLowerCase().includes(q)).forEach(x => {
        alleMatches.push({id: x.id, type: info.type, naam: info.naam(x), label: info.label});
      });
    });
    alleMatches.sort((a,b) => a.naam.localeCompare(b.naam));
    const matches = alleMatches.slice(0, 25);
    if (matches.length === 0) return `<p style="padding:12px; font-size:13px; color:var(--ink-faint);">Niets gevonden.</p>`;
    return matches.map(m => {
      const inBoek = kookboekHasItem(kb, m.id, m.type);
      return `
      <label style="display:flex; align-items:center; gap:10px; padding:9px 10px; cursor:pointer; border-bottom:1px solid var(--line);" class="atk-row">
        <input type="checkbox" data-kb-item-checkbox="${m.type}:${m.id}" ${inBoek?'checked':''}>
        <span style="font-size:13.5px;">${esc(m.naam)}</span>
        <span style="font-size:11.5px; color:var(--ink-faint); margin-left:auto;">${esc(m.label)}</span>
      </label>`;
    }).join("");
  }

  function renderKookboekItemCard({id, type, obj, info}, kb){
    const hoofdstukken = getKookboekHoofdstukken(kb);

    return `

      <div class="card-media">

      </div>
      <div class="card-body">
        <div class="card-title">${esc(info.naam(obj))}</div>
        <div class="card-desc">${esc(obj.beschrijving||"")}</div>
        <div class="card-meta"><span>${info.label}</span>${obj.bereidingstijd_minuten||obj.totale_tijd_minuten?`<span>${ICONS.clock}${obj.totale_tijd_minuten||obj.bereidingstijd_minuten} min</span>`:''}</div>
        ${hoofdstukken.length ? `
        <select class="field-select" data-kb-item-hoofdstuk="${type}:${id}" style="font-size:12px; height:28px; margin-top:4px;" onclick="event.stopPropagation()">
          <option value="">Geen hoofdstuk (Overig)</option>
          ${hoofdstukken.map(h => `<option value="${esc(h.id)}" ${huidigHoofdstukId===h.id?'selected':''}>${esc(h.naam)}</option>`).join("")}

  function renderKookboekItemsGrouped(kb){
    const hoofdstukken = getKookboekHoofdstukken(kb);
    if (hoofdstukken.length === 0){
      const items = getKookboekItems(kb);
      return `<div class="grid">${items.map(it => renderKookboekItemCard(it, kb)).join("")}</div>`;
    }
    const { groups, overig } = groupKookboekItemsByHoofdstuk(kb);
    return groups.map(g => `
      <div class="section-title">${esc(g.hoofdstuk.naam)}</div>
      ${g.items.length ? `<div class="grid" style="margin-bottom:8px;">${g.items.map(it => renderKookboekItemCard(it, kb)).join("")}</div>` : `<p style="color:var(--ink-faint); font-size:13px; margin-bottom:8px;">Nog geen items in dit hoofdstuk.</p>`}
    `).join("") + `
      <div class="section-title">Overig</div>
      ${overig.length ? `<div class="grid">${overig.map(it => renderKookboekItemCard(it, kb)).join("")}</div>` : `<p style="color:var(--ink-faint); font-size:13px;">Alle items zijn al in een hoofdstuk ingedeeld.</p>`}
    `;
  }

  function renderAddToKookboekModal(item, itemType){

    <div class="modal-scrim open" id="add-to-kookboek-scrim">
      <div class="modal" style="max-width:440px;">
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;">
            <h2 style="font-size:19px;">Toevoegen aan kookboek</h2>
            <button class="close-x" id="close-add-to-kookboek" aria-label="Sluiten">${ICONS.x}</button>
          </div>
          ${kbs.length === 0 ? `<p style="font-size:13.5px; color:var(--ink-faint); margin-bottom:16px;">Je hebt nog geen kookboeken.</p>` : `

  function renderRenameKookboekModal(kb){
    return `
    <div class="modal-scrim open" id="rename-kookboek-scrim">
      <div class="modal" style="max-width:480px;">
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;">
            <h2 style="font-size:20px;">Kookboek bewerken</h2>
            <button class="close-x" id="close-rename-kookboek" aria-label="Sluiten">${ICONS.x}</button>
          </div>
          <div class="field-row"><label class="field-label">Naam</label><input class="field-input" id="kb-rename-naam" value="${esc(kb.naam)}"></div>
          <div class="field-row"><label class="field-label">Beschrijving</label><textarea class="field-textarea" id="kb-rename-beschrijving">${esc(kb.beschrijving||'')}</textarea></div>
          <button class="btn btn-primary" id="kb-rename-save-btn" type="button">Opslaan</button>
        </div>
      </div>
    </div>`;
