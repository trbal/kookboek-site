  function attachKookboekHandlers(){
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));

    const addKookboekBtn = $("#add-kookboek-btn");
    if (addKookboekBtn) addKookboekBtn.addEventListener("click", () => goTo("add"));
    const emptyAddKookboekBtn = $("#empty-add-kookboek-btn");
    if (emptyAddKookboekBtn) emptyAddKookboekBtn.addEventListener("click", () => goTo("add"));
    $$("[data-open-kookboek]").forEach(el => el.addEventListener("click", () => {
      state.activeKookboekId = el.getAttribute("data-open-kookboek");
      state.kookboekRecipeSearch = "";
      render();
      window.scrollTo({top:0});
    }));
    const backToKookboeken = $("#back-to-kookboeken");
    if (backToKookboeken) backToKookboeken.addEventListener("click", () => {
      state.activeKookboekId = null;
      state.kookboekRenameOpen = false;
      state.kookboekRecipeSearch = "";
      render();
      window.scrollTo({top:0});
    });
    const kbSaveBtn = $("#kb-save-btn");
    if (kbSaveBtn) kbSaveBtn.addEventListener("click", async () => {
      const naam = $("#kb-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const item = {
        id: "kookboek-" + slugify(naam) + "-" + Math.random().toString(36).slice(2,7),
        naam: naam,
        beschrijving: $("#kb-beschrijving").value.trim() || null,
        items: []
      };
      await saveKookboek(item);
      showToast("Kookboek aangemaakt");
      state.activeKookboekId = item.id;
      goTo("grid");
    });
    const kbRecipeSearch = $("#kb-recipe-search");
    if (kbRecipeSearch) kbRecipeSearch.addEventListener("input", (e) => {
      state.kookboekRecipeSearch = e.target.value;
      render();
      preserveFocus("#kb-recipe-search");
    });
    $$("[data-remove-from-kookboek]").forEach(el => el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const [type, id] = el.getAttribute("data-remove-from-kookboek").split(":");
      const kb = getKookboek(state.activeKookboekId);
      const currentItems = kb.items ? kb.items : (kb.recept_ids || []).map(rid => ({id: rid, type: "recept"}));
      const bijgewerkt = Object.assign({}, kb, { items: currentItems.filter(it => !(it.id === id && it.type === type)) });
      delete bijgewerkt.recept_ids;
      await saveKookboek(bijgewerkt);
      showToast("Verwijderd uit kookboek");
      render();
    }));
    $$("[data-open-kookboek-item]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-remove-from-kookboek]")) return;
      if (e.target.closest("[data-kb-item-hoofdstuk]")) return;
      const [type, id] = el.getAttribute("data-open-kookboek-item").split(":");
      state.activeKookboekId = null;
      if (type === "recept"){
        state.activeTab = "eten";
        goTo("detail", id);
      } else if (type === "drank"){
        state.activeTab = "drinken";
        goToDrink("detail", id);
      } else {
        state.activeTab = "basis";
        state.basisSubTab = type === "kruidenmix" ? "kruidenmixen" : (type === "saus" ? "sauzen" : "dessertbasis");
        goToBasis("detail", id);
      }
    }));
    const renameKookboekBtn = $("#rename-kookboek-btn");
    if (renameKookboekBtn) renameKookboekBtn.addEventListener("click", () => {
      state.kookboekRenameOpen = true;
      render();
    });
    const closeRenameKookboek = $("#close-rename-kookboek");
    if (closeRenameKookboek) closeRenameKookboek.addEventListener("click", () => {
      state.kookboekRenameOpen = false;
      render();
    });
    const kbRenameSaveBtn = $("#kb-rename-save-btn");
    if (kbRenameSaveBtn) kbRenameSaveBtn.addEventListener("click", async () => {
      const naam = $("#kb-rename-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const kb = getKookboek(state.activeKookboekId);
      const bijgewerkt = Object.assign({}, kb, { naam: naam, beschrijving: $("#kb-rename-beschrijving").value.trim() || null });
      await saveKookboek(bijgewerkt);
      state.kookboekRenameOpen = false;
      showToast("Opgeslagen");
      render();
    });
    const deleteKookboekBtn = $("#delete-kookboek-btn");
    if (deleteKookboekBtn) deleteKookboekBtn.addEventListener("click", async () => {
      const kb = getKookboek(state.activeKookboekId);
      const ok = await confirmDialog(`"${kb.naam}" wordt permanent verwijderd (de recepten zelf blijven bestaan). Doorgaan?`, {confirmLabel: "Verwijderen"});
      if (ok){
        await deleteKookboek(kb.id);
        state.activeKookboekId = null;
        showToast("Kookboek verwijderd");
        render();
      }
    });

    const manageHoofdstukkenBtn = $("#manage-hoofdstukken-btn");
    if (manageHoofdstukkenBtn) manageHoofdstukkenBtn.addEventListener("click", () => {
      state.kookboekHoofdstukkenBeheerOpen = true;
      render();
    });
    const closeHoofdstukkenBeheer = $("#close-hoofdstukken-beheer");
    if (closeHoofdstukkenBeheer) closeHoofdstukkenBeheer.addEventListener("click", () => {
      state.kookboekHoofdstukkenBeheerOpen = false;
      render();
    });
    const hoofdstukkenBeheerScrim = $("#hoofdstukken-beheer-scrim");
    if (hoofdstukkenBeheerScrim) hoofdstukkenBeheerScrim.addEventListener("click", (e) => {
      if (e.target === hoofdstukkenBeheerScrim){ state.kookboekHoofdstukkenBeheerOpen = false; render(); }
    });
    const voegHoofdstukToeBtn = $("#voeg-hoofdstuk-toe-btn");
    if (voegHoofdstukToeBtn) voegHoofdstukToeBtn.addEventListener("click", async () => {
      const naam = $("#nieuw-hoofdstuk-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const kb = getKookboek(state.activeKookboekId);
      const nieuwHoofdstuk = { id: uid("hfdstk"), naam: naam, item_keys: [] };
      const bijgewerkt = Object.assign({}, kb, { hoofdstukken: getKookboekHoofdstukken(kb).concat([nieuwHoofdstuk]) });
      await saveKookboek(bijgewerkt);
      showToast("Hoofdstuk toegevoegd");
      render();
    });
    $$("[data-hoofdstuk-naam-input]").forEach(el => el.addEventListener("change", async () => {
      const hid = el.getAttribute("data-hoofdstuk-naam-input");
      const naam = el.value.trim();
      if (!naam) return;
      const kb = getKookboek(state.activeKookboekId);
      const bijgewerkt = Object.assign({}, kb, {
        hoofdstukken: getKookboekHoofdstukken(kb).map(h => h.id === hid ? Object.assign({}, h, {naam}) : h)
      });
      await saveKookboek(bijgewerkt);
      showToast("Opgeslagen");
      render();
    }));
    $$("[data-hoofdstuk-omhoog]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-hoofdstuk-omhoog");
      const kb = getKookboek(state.activeKookboekId);
      const lijst = getKookboekHoofdstukken(kb).slice();
      const idx = lijst.findIndex(h => h.id === hid);
      if (idx <= 0) return;
      [lijst[idx-1], lijst[idx]] = [lijst[idx], lijst[idx-1]];
      await saveKookboek(Object.assign({}, kb, { hoofdstukken: lijst }));
      render();
    }));
    $$("[data-hoofdstuk-omlaag]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-hoofdstuk-omlaag");
      const kb = getKookboek(state.activeKookboekId);
      const lijst = getKookboekHoofdstukken(kb).slice();
      const idx = lijst.findIndex(h => h.id === hid);
      if (idx === -1 || idx >= lijst.length-1) return;
      [lijst[idx], lijst[idx+1]] = [lijst[idx+1], lijst[idx]];
      await saveKookboek(Object.assign({}, kb, { hoofdstukken: lijst }));
      render();
    }));
    $$("[data-verwijder-hoofdstuk]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-verwijder-hoofdstuk");
      const ok = await confirmDialog("Dit hoofdstuk wordt verwijderd. De items zelf blijven in het kookboek staan (als 'Overig'). Doorgaan?", {confirmLabel: "Verwijderen"});
      if (!ok) return;
      const kb = getKookboek(state.activeKookboekId);
      const bijgewerkt = Object.assign({}, kb, { hoofdstukken: getKookboekHoofdstukken(kb).filter(h => h.id !== hid) });
      await saveKookboek(bijgewerkt);
      showToast("Hoofdstuk verwijderd");
      render();
    }));
    $$("[data-kb-item-hoofdstuk]").forEach(el => el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const [type, id] = el.getAttribute("data-kb-item-hoofdstuk").split(":");
      const key = itemKey(type, id);
      const kb = getKookboek(state.activeKookboekId);
      const nieuweHoofdstukId = el.value || null;
      const bijgewerkteHoofdstukken = getKookboekHoofdstukken(kb).map(h => {
        const zonderDitItem = (h.item_keys||[]).filter(k => k !== key);
        if (h.id === nieuweHoofdstukId) return Object.assign({}, h, { item_keys: zonderDitItem.concat([key]) });
        return Object.assign({}, h, { item_keys: zonderDitItem });
      });
      await saveKookboek(Object.assign({}, kb, { hoofdstukken: bijgewerkteHoofdstukken }));
      showToast("Hoofdstuk bijgewerkt");
      render();
    }));

    const addToKookboekBtn = $("#add-to-kookboek-btn");
    if (addToKookboekBtn) addToKookboekBtn.addEventListener("click", () => {
      if (state.activeTab === "eten"){
        state.addToKookboekOpen = {id: state.activeRecipeId, type: "recept"};
      } else if (state.activeTab === "drinken"){
        state.addToKookboekOpen = {id: state.activeDrinkId, type: "drank"};
      } else if (state.activeTab === "basis"){
        const basisType = state.basisSubTab === "kruidenmixen" ? "kruidenmix" : (state.basisSubTab === "sauzen" ? "saus" : "dessertbasis");
        state.addToKookboekOpen = {id: state.activeBasisId, type: basisType};
      }
      render();
    });
    const closeAddToKookboek = $("#close-add-to-kookboek");
    if (closeAddToKookboek) closeAddToKookboek.addEventListener("click", () => {
      state.addToKookboekOpen = null;
      render();
    });
    const atkCreateBtn = $("#atk-create-btn");
    if (atkCreateBtn) atkCreateBtn.addEventListener("click", async () => {
      const naam = $("#atk-new-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const target = state.addToKookboekOpen;
      const item = {
        id: "kookboek-" + slugify(naam) + "-" + Math.random().toString(36).slice(2,7),
        naam: naam,
        beschrijving: null,
        items: [{id: target.id, type: target.type}]
      };
      await saveKookboek(item);
      showToast(`Kookboek "${naam}" aangemaakt en item toegevoegd`);
      state.addToKookboekOpen = null;
      render();
    });
  }

  // ============================================================
  // TECHNIEKEN & DOCUMENTATIE — eerste domein gebouwd in het
  // gemodulariseerde patroon (Fase 2). Geen ingrediënten/porties/
  // versiebeheer zoals recepten: gewoon een titel, categorie,
  // bron en vrije inhoud, plus optioneel gekoppelde recepten.
  // ============================================================

  function filteredTechnieken(){
    let list = state.technieken.slice();
    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();

  async function saveNaslagwerk(item){ await saveToCollection("naslagwerken", item); }
  async function deleteNaslagwerk(id){ await deleteFromCollection("naslagwerken", id); }
  function getNaslagwerk(id){ return state.naslagwerken.find(x => x.id === id); }

  function getNaslagwerkTechniekIds(nw){ return nw.techniek_ids || []; }
  function getNaslagwerkItems(nw){
    return getNaslagwerkTechniekIds(nw).map(id => getTechniek(id)).filter(Boolean);
  }
  function naslagwerkHasTechniek(nw, techniekId){
    return getNaslagwerkTechniekIds(nw).includes(techniekId);
  }

  // ---- Hoofdstukken (zelfde structuur als bij kookboeken) ----
  function getNaslagwerkHoofdstukken(nw){ return nw.hoofdstukken || []; }
  function getTechniekHoofdstukId(nw, techniekId){
    const h = getNaslagwerkHoofdstukken(nw).find(h => (h.item_keys||[]).includes(techniekId));
    return h ? h.id : null;
  }
  function groupNaslagwerkItemsByHoofdstuk(nw){
    const hoofdstukken = getNaslagwerkHoofdstukken(nw);
    const items = getNaslagwerkItems(nw);
    const groups = hoofdstukken.map(h => ({ hoofdstuk: h, items: [] }));
    const overig = [];
    items.forEach(t => {
      const hid = getTechniekHoofdstukId(nw, t.id);
      const group = groups.find(g => g.hoofdstuk.id === hid);
      if (group) group.items.push(t); else overig.push(t);
    });
    return { groups, overig };
  }

      window.scrollTo({top:0});

      if (!naam){ showToast("Geef een naam op"); return; }
      const item = {
        id: "naslagwerk-" + slugify(naam) + "-" + Math.random().toString(36).slice(2,7),
        naam: naam,
        beschrijving: $("#nw-beschrijving").value.trim() || null,
        techniek_ids: []
      };
      await saveNaslagwerk(item);
      showToast("Naslagwerk aangemaakt");
      state.activeNaslagwerkId = item.id;
      goTo("grid");
    });
    const nwTechniekSearch = $("#nw-techniek-search");
    if (nwTechniekSearch) nwTechniekSearch.addEventListener("input", (e) => {
      state.naslagwerkTechniekSearch = e.target.value;
      render();
      preserveFocus("#nw-techniek-search");
    });
    $$("[data-nw-item-checkbox]").forEach(el => el.addEventListener("change", async (e) => {
      const techniekId = el.getAttribute("data-nw-item-checkbox");
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const ids = getNaslagwerkTechniekIds(nw).slice();
      const idx = ids.indexOf(techniekId);
      if (e.target.checked && idx === -1) ids.push(techniekId);
      else if (!e.target.checked && idx !== -1) ids.splice(idx, 1);
      await saveNaslagwerk(Object.assign({}, nw, { techniek_ids: ids }));
      showToast(e.target.checked ? "Toegevoegd" : "Verwijderd");
      render();
      preserveFocus("#nw-techniek-search");
    }));
    $$("[data-remove-from-naslagwerk]").forEach(el => el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const techniekId = el.getAttribute("data-remove-from-naslagwerk");
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const ids = getNaslagwerkTechniekIds(nw).filter(id => id !== techniekId);
      await saveNaslagwerk(Object.assign({}, nw, { techniek_ids: ids }));
      showToast("Verwijderd uit naslagwerk");
      render();
    }));
    $$("[data-open-naslagwerk-item]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-remove-from-naslagwerk]")) return;
      if (e.target.closest("[data-nw-item-hoofdstuk]")) return;
      const techniekId = el.getAttribute("data-open-naslagwerk-item");
      state.activeNaslagwerkId = null;
      state.activeTab = "technieken";
      goToTechniek("detail", techniekId);
    }));
    const renameNaslagwerkBtn = $("#rename-naslagwerk-btn");
    if (renameNaslagwerkBtn) renameNaslagwerkBtn.addEventListener("click", () => {
      state.naslagwerkRenameOpen = true;
      render();
    });
    const closeRenameNaslagwerk = $("#close-rename-naslagwerk");
    if (closeRenameNaslagwerk) closeRenameNaslagwerk.addEventListener("click", () => {
      state.naslagwerkRenameOpen = false;
      render();
    });
    const nwRenameSaveBtn = $("#nw-rename-save-btn");
    if (nwRenameSaveBtn) nwRenameSaveBtn.addEventListener("click", async () => {
      const naam = $("#nw-rename-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const bijgewerkt = Object.assign({}, nw, { naam: naam, beschrijving: $("#nw-rename-beschrijving").value.trim() || null });
      await saveNaslagwerk(bijgewerkt);
      state.naslagwerkRenameOpen = false;
      showToast("Opgeslagen");
      render();
    });
    const deleteNaslagwerkBtn = $("#delete-naslagwerk-btn");
    if (deleteNaslagwerkBtn) deleteNaslagwerkBtn.addEventListener("click", async () => {
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const ok = await confirmDialog(`"${nw.naam}" wordt permanent verwijderd (de technieken zelf blijven bestaan). Doorgaan?`, {confirmLabel: "Verwijderen"});
      if (ok){
        await deleteNaslagwerk(nw.id);
        state.activeNaslagwerkId = null;
        showToast("Naslagwerk verwijderd");
        render();
      }
    });

    const manageNwHoofdstukkenBtn = $("#manage-nw-hoofdstukken-btn");
    if (manageNwHoofdstukkenBtn) manageNwHoofdstukkenBtn.addEventListener("click", () => {
      state.naslagwerkHoofdstukkenBeheerOpen = true;
      render();
    });
    const closeNwHoofdstukkenBeheer = $("#close-nw-hoofdstukken-beheer");
    if (closeNwHoofdstukkenBeheer) closeNwHoofdstukkenBeheer.addEventListener("click", () => {
      state.naslagwerkHoofdstukkenBeheerOpen = false;
      render();
    });
    const nwHoofdstukkenBeheerScrim = $("#nw-hoofdstukken-beheer-scrim");
    if (nwHoofdstukkenBeheerScrim) nwHoofdstukkenBeheerScrim.addEventListener("click", (e) => {
      if (e.target === nwHoofdstukkenBeheerScrim){ state.naslagwerkHoofdstukkenBeheerOpen = false; render(); }
    });
    const voegNwHoofdstukToeBtn = $("#voeg-nw-hoofdstuk-toe-btn");
    if (voegNwHoofdstukToeBtn) voegNwHoofdstukToeBtn.addEventListener("click", async () => {
      const naam = $("#nieuw-nw-hoofdstuk-naam").value.trim();
      if (!naam){ showToast("Geef een naam op"); return; }
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const nieuwHoofdstuk = { id: uid("hfdstk"), naam: naam, item_keys: [] };
      const bijgewerkt = Object.assign({}, nw, { hoofdstukken: getNaslagwerkHoofdstukken(nw).concat([nieuwHoofdstuk]) });
      await saveNaslagwerk(bijgewerkt);
      showToast("Hoofdstuk toegevoegd");
      render();
    });
    $$("[data-nw-hoofdstuk-naam-input]").forEach(el => el.addEventListener("change", async () => {
      const hid = el.getAttribute("data-nw-hoofdstuk-naam-input");
      const naam = el.value.trim();
      if (!naam) return;
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const bijgewerkt = Object.assign({}, nw, {
        hoofdstukken: getNaslagwerkHoofdstukken(nw).map(h => h.id === hid ? Object.assign({}, h, {naam}) : h)
      });
      await saveNaslagwerk(bijgewerkt);
      showToast("Opgeslagen");
      render();
    }));
    $$("[data-nw-hoofdstuk-omhoog]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-nw-hoofdstuk-omhoog");
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const lijst = getNaslagwerkHoofdstukken(nw).slice();
      const idx = lijst.findIndex(h => h.id === hid);
      if (idx <= 0) return;
      [lijst[idx-1], lijst[idx]] = [lijst[idx], lijst[idx-1]];
      await saveNaslagwerk(Object.assign({}, nw, { hoofdstukken: lijst }));
      render();
    }));
    $$("[data-nw-hoofdstuk-omlaag]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-nw-hoofdstuk-omlaag");
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const lijst = getNaslagwerkHoofdstukken(nw).slice();
      const idx = lijst.findIndex(h => h.id === hid);
      if (idx === -1 || idx >= lijst.length-1) return;
      [lijst[idx], lijst[idx+1]] = [lijst[idx+1], lijst[idx]];
      await saveNaslagwerk(Object.assign({}, nw, { hoofdstukken: lijst }));
      render();
    }));
    $$("[data-nw-verwijder-hoofdstuk]").forEach(el => el.addEventListener("click", async () => {
      const hid = el.getAttribute("data-nw-verwijder-hoofdstuk");
      const ok = await confirmDialog("Dit hoofdstuk wordt verwijderd. De technieken zelf blijven in het naslagwerk staan (als 'Overig'). Doorgaan?", {confirmLabel: "Verwijderen"});
      if (!ok) return;
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const bijgewerkt = Object.assign({}, nw, { hoofdstukken: getNaslagwerkHoofdstukken(nw).filter(h => h.id !== hid) });
      await saveNaslagwerk(bijgewerkt);
      showToast("Hoofdstuk verwijderd");
      render();
    }));
    $$("[data-nw-item-hoofdstuk]").forEach(el => el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const techniekId = el.getAttribute("data-nw-item-hoofdstuk");
      const nw = getNaslagwerk(state.activeNaslagwerkId);
      const nieuweHoofdstukId = el.value || null;
      const bijgewerkteHoofdstukken = getNaslagwerkHoofdstukken(nw).map(h => {
        const zonderDitItem = (h.item_keys||[]).filter(k => k !== techniekId);
        if (h.id === nieuweHoofdstukId) return Object.assign({}, h, { item_keys: zonderDitItem.concat([techniekId]) });
        return Object.assign({}, h, { item_keys: zonderDitItem });
      });
      await saveNaslagwerk(Object.assign({}, nw, { hoofdstukken: bijgewerkteHoofdstukken }));
      showToast("Hoofdstuk bijgewerkt");
      render();
    }));
  }

  // ---------- Event handlers ----------
  function attachHandlers(){
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));

    attachDrinkHandlers();
    attachKookboekHandlers();
    attachNaslagwerkHandlers();

    const searchInput = $("#search-input");
    if (searchInput) searchInput.addEventListener("input", e => { state.search = e.target.value; render(); preserveFocus("#search-input"); });

    $$("[data-tab]").forEach(el => el.addEventListener("click", () => {
      state.activeTab = el.getAttribute("data-tab");
      state.view = "grid";
      state.search = "";
      render();
    }));
    $$("[data-voorraad-subtab]").forEach(el => el.addEventListener("click", () => {
      state.voorraadSubTab = el.getAttribute("data-voorraad-subtab");
      render();
    }));
    $$("[data-planning-subtab]").forEach(el => el.addEventListener("click", () => {
      state.planningSubTab = el.getAttribute("data-planning-subtab");
      render();
    }));

    const addBtn = $("#add-recipe-btn");
    if (addBtn) addBtn.addEventListener("click", () => goTo("add"));
    const addVoorraadBtn = $("#add-voorraad-btn");
    if (addVoorraadBtn) addVoorraadBtn.addEventListener("click", () => goTo("add"));
    const printVoorraadBtn = $("#print-voorraad-btn");
    if (printVoorraadBtn) printVoorraadBtn.addEventListener("click", () => {
      const sub = state.voorraadSubTab;
      let title, body;
      if (sub === "ingredienten"){
        title = "Voorraad — Ingrediënten";
        const items = state.voorraadIngredienten.slice().sort((a,b) => (a.naam||"").localeCompare(b.naam||""));
        body = `<h1>${title}</h1>` + (items.map(i => `<div class="ing-row"><span class="ing-amt">${fmtNum(i.hoeveelheid,1)}${i.eenheid?' '+esc(i.eenheid):''}</span>${esc(i.naam)}${i.locatie?' · '+esc(i.locatie):''}${i.houdbaarTot?' · houdbaar tot '+esc(i.houdbaarTot):''}</div>`).join("") || '<p>Geen ingrediënten.</p>');
      } else if (sub === "flessen"){
        title = "Voorraad — Flessen";
        const items = state.voorraadFlessen.slice().sort((a,b) => (a.naam||"").localeCompare(b.naam||""));
        body = `<h1>${title}</h1>` + (items.map(i => `<div class="ing-row"><span class="ing-amt">${i.gesloten||0} gesloten, ${i.open||0} open</span>${esc(i.naam)}</div>`).join("") || '<p>Geen flessen.</p>');
      } else {
        title = "Voorraad — Materiaal";
        const items = state.voorraadMateriaal.slice().sort((a,b) => (a.naam||"").localeCompare(b.naam||""));
        body = `<h1>${title}</h1>` + (items.map(i => `<div class="ing-row"><span class="ing-amt" style="min-width:0;"></span>${esc(i.naam)}${i.beschrijving?' — '+esc(i.beschrijving):''}</div>`).join("") || '<p>Geen materiaal.</p>');
      }
      openPrintWindow(title, body);
    });
    const addPlanningBtn = $("#add-planning-btn");
    if (addPlanningBtn) addPlanningBtn.addEventListener("click", () => goTo("add"));
    const emptyAddBtn = $("#empty-add-btn");
    if (emptyAddBtn) emptyAddBtn.addEventListener("click", () => goTo("add"));
    const retryBtn = $("#retry-load-btn");
    if (retryBtn) retryBtn.addEventListener("click", () => loadAll());
    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", () => logout());
    const beheerBtn = document.getElementById("beheer-btn");
    if (beheerBtn) beheerBtn.addEventListener("click", () => openBeheer());
    const closeAddModal = $("#close-add-modal");
    if (closeAddModal) closeAddModal.addEventListener("click", () => goTo("grid"));
    const addModalScrim = $("#add-modal-scrim");
    if (addModalScrim) addModalScrim.addEventListener("click", (e) => { if (e.target === addModalScrim) goTo("grid"); });

    const mobileFilterBtn = $("#mobile-filter-btn");
    if (mobileFilterBtn) mobileFilterBtn.addEventListener("click", () => { state.mobileFiltersOpen = !state.mobileFiltersOpen; render(); });

    $$("[data-tag]").forEach(el => el.addEventListener("click", () => {
      const tag = el.getAttribute("data-tag");
      const i = state.filters.tags.indexOf(tag);
      if (i === -1) state.filters.tags.push(tag); else state.filters.tags.splice(i,1);
      render();
    }));
    const favFilterBtn = $("[data-fav-filter]");
    if (favFilterBtn) favFilterBtn.addEventListener("click", () => {
      state.filters.favoritenOnly = !state.filters.favoritenOnly;
      render();
    });
    $$("[data-cat-filter]").forEach(el => el.addEventListener("change", () => {
      const key = el.getAttribute("data-cat-filter");
      state.filters[key] = el.value || null;
      render();
    }));
    $$("[data-diff]").forEach(el => el.addEventListener("click", () => {
      const d = el.getAttribute("data-diff");
      state.filters.difficulty = state.filters.difficulty === d ? null : d;
      render();
    }));
    const timeRange = $("#time-range");
    if (timeRange) timeRange.addEventListener("input", e => {
      const v = parseInt(e.target.value);
      state.filters.maxTime = v >= 180 ? null : v;
      $("#time-range-val").textContent = state.filters.maxTime ? state.filters.maxTime + " min" : "Alles";
    });
    if (timeRange) timeRange.addEventListener("change", () => render());

    const clearBtn = $("#clear-filters-btn");
    if (clearBtn) clearBtn.addEventListener("click", () => { state.filters = {tags:[],difficulty:null,maxTime:null,favoritenOnly:false,gangType:null,eiwitbron:null,dieet:null,seizoen:null,gelegenheid:null,bereidingswijze:null}; render(); });

    const sortSelect = $("#sort-select");
    if (sortSelect) sortSelect.addEventListener("change", e => { state.sort = e.target.value; render(); });

    $$("[data-open]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-fav]")) return;
      goTo("detail", el.getAttribute("data-open"));
    }));
    $$("[data-fav]").forEach(el => el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-fav");
      const r = getRecipe(id);
      const bijgewerkt = Object.assign({}, r, { favoriet: !r.favoriet });
      await saveRecipe(bijgewerkt);
      render();
    }));

    $$("[data-open-puur]").forEach(el => el.addEventListener("click", (e) => {
      if (e.target.closest("[data-puur-fav]")) return;
      goToPuur("detail", el.getAttribute("data-open-puur"));
    }));
    $$("[data-puur-fav]").forEach(el => el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-puur-fav");
      const x = getPuur(id);
      const bijgewerkt = Object.assign({}, x, { favoriet: !x.favoriet });
      await savePuur(bijgewerkt);
      render();
    }));
    const detailPuurFavBtn = $("#detail-puur-fav-btn");
    if (detailPuurFavBtn) detailPuurFavBtn.addEventListener("click", async () => {
      const x = getPuur(state.activePuurId);
      const bijgewerkt = Object.assign({}, x, { favoriet: !x.favoriet });
      await savePuur(bijgewerkt);
      render();
    });
    const printPuurBtn = $("#print-puur-btn");
    if (printPuurBtn) printPuurBtn.addEventListener("click", () => {
      const x = getPuur(state.activePuurId);
      const row = (label, value) => value ? `<div class="ing-row"><span class="ing-amt" style="min-width:170px;">${esc(label)}</span>${esc(value)}</div>` : '';
      const metaParts = [x.categorie, x.producent, x.land ? (x.land+(x.regio?', '+x.regio:'')) : null, x.jaartal ? String(x.jaartal) : null, x.alcoholpercentage ? fmtNum(x.alcoholpercentage,1)+'% alc.' : null].filter(Boolean);
      let profielHtml = '';
      if (x.categorie === "Wijn"){
        const w = x.wijn_degustatie || {};
        const vis = w.visueel || {}, olf = w.olfactief || {}, gus = w.gustatief || {}, con = w.conclusie || {};
        profielHtml = `
          ${w.wijntype ? `<h2>Wijntype</h2>${row("Type", w.wijntype)}` : ''}
          ${(vis.intensiteit||vis.helderheid||vis.schittering||vis.kleur_nuance||vis.andere) ? `<h2>Visuele fase</h2>${row("Intensiteit",vis.intensiteit)}${row("Helderheid",vis.helderheid)}${row("Schittering",vis.schittering)}${row("Kleur & nuance",vis.kleur_nuance)}${row("Andere",vis.andere)}` : ''}
          ${(olf.zuiverheid||olf.intensiteit||olf.evolutie||(olf.aromagroepen&&olf.aromagroepen.length)||(olf.concrete_aromas&&olf.concrete_aromas.length)||olf.aard_aromas) ? `<h2>Olfactieve fase</h2>${row("Zuiverheid",olf.zuiverheid)}${row("Intensiteit",olf.intensiteit)}${row("Evolutie",olf.evolutie)}${(olf.aromagroepen&&olf.aromagroepen.length)?row("Aromagroepen",olf.aromagroepen.join(", ")):''}${(olf.concrete_aromas&&olf.concrete_aromas.length)?row("Concrete aroma's",olf.concrete_aromas.join(", ")):''}${row("Aard van de aroma's",olf.aard_aromas)}` : ''}
          ${(gus.aanzet||gus.middenmond||gus.afdronk) ? `<h2>Gustatieve fase</h2>
            ${gus.aanzet ? row("Aanzet — zuiverheid",gus.aanzet.zuiverheid)+row("Aanzet — intensiteit",gus.aanzet.intensiteit)+row("Aanzet — eerste indruk",gus.aanzet.eerste_indruk)+row("Aanzet — retro-olfactie",gus.aanzet.retro_olfactie):''}
            ${gus.middenmond ? row("Middenmond — zuren",gus.middenmond.zuren_hoeveelheid)+row("Middenmond — zoetheid",gus.middenmond.zoetheid)+row("Middenmond — tannine",gus.middenmond.tannine_hoeveelheid)+row("Middenmond — alcohol",gus.middenmond.alcohol)+row("Middenmond — evenwicht",gus.middenmond.evenwicht):''}
            ${gus.afdronk ? row("Afdronk — PAI aroma",gus.afdronk.pai_aroma)+row("Afdronk — PAI lengte",gus.afdronk.pai_lengte)+row("Afdronk — PG smaak",gus.afdronk.pg_smaak)+row("Afdronk — PG lengte",gus.afdronk.pg_lengte):''}` : ''}
          ${Object.keys(con).length ? `<h2>Conclusie</h2>${row("Wijnstijl",con.wijnstijl)}${row("Waardering",con.persoonlijke_waardering)}${row("Bilan",con.bilan)}${row("Klimaat",con.klimaat)}${row("Bewaarpotentieel",con.bewaarpotentieel)}${row("Service",con.service)}${row("Vinificatie",con.vinificatie)}${row("Wijn en gerechten",con.wijn_en_gerechten)}${row("Origine",con.origine)}` : ''}
        `;
      } else {
        const sp = x.smaakprofiel || {};
        if (sp.intensiteit||sp.neus||sp.mond||sp.afdronk||sp.vrije_notities){
          profielHtml = `<h2>Smaakprofiel</h2>${row("Intensiteit",sp.intensiteit)}${row("Neus",sp.neus)}${row("Mond",sp.mond)}${row("Afdronk",sp.afdronk)}${row("Overige notities",sp.vrije_notities)}`;
        }
      }
      const voorraad = x.voorraad_id ? getVoorraadFles(x.voorraad_id) : null;
      const voorraadHtml = voorraad ? `<h2>Voorraad</h2>${row("Gesloten", String(voorraad.gesloten||0))}${row("Open", String(voorraad.open||0))}` : '';
      const body = `<h1>${esc(x.naam)}</h1><div class="meta">${esc(metaParts.join(' · '))}</div>
        ${x.beschrijving ? `<p style="font-size:14px;">${esc(x.beschrijving)}</p>` : ''}
        ${profielHtml}
        ${x.gerecht_suggestie ? `<h2>Suggestie bij gerecht</h2><p style="font-size:14px;">${esc(x.gerecht_suggestie)}</p>` : ''}
        ${voorraadHtml}`;
      openPrintWindow(x.naam, body);

    const deletePuurBtn = $("#delete-puur-btn");
    if (deletePuurBtn) deletePuurBtn.addEventListener("click", async () => {
      const x = getPuur(state.activePuurId);
      const ok = await confirmDialog(`"${x.naam}" en de volledige versiegeschiedenis worden permanent verwijderd. Doorgaan?`, {confirmLabel: "Verwijderen"});
      if (ok){
        await deletePuur(state.activePuurId);
        showToast("Verwijderd");
        goToPuur("grid");
      }
    });
    const gotoVoorraadBtn = $("#goto-voorraad-btn");
    if (gotoVoorraadBtn) gotoVoorraadBtn.addEventListener("click", () => {
      state.activeTab = "voorraad";

      state.view = "grid";
      render();
      window.scrollTo({top:0});
    });
    const puurFavFilterBtn = $("[data-puur-fav-filter]");
    if (puurFavFilterBtn) puurFavFilterBtn.addEventListener("click", () => {
      state.puurFilters.favoritenOnly = !state.puurFilters.favoritenOnly;
      render();
    });
    $$("[data-puur-cat-filter]").forEach(el => el.addEventListener("click", () => {
      const c = el.getAttribute("data-puur-cat-filter");
      state.puurFilters.categorie = state.puurFilters.categorie === c ? null : c;

  function attachManualEditDynamicHandlers(){
    const $ = sel => document.querySelector(sel);
    function renderIngList(){
      const container = $("#edit-ingredients-list");
      if (!container) return;
      container.innerHTML = editIngredients.map(renderEditIngredientRow).join("");
      Array.from(document.querySelectorAll("[data-eing-remove]")).forEach(b => b.addEventListener("click", () => {
        editIngredients = editIngredients.filter(i => i.id !== b.getAttribute("data-eing-remove"));
        if (editIngredients.length === 0) editIngredients.push({id: uid("ing").slice(0,8), naam:"", hoeveelheid:"", eenheid:""});
        renderIngList();
      }));
      Array.from(document.querySelectorAll("[data-eing-amt]")).forEach(el => el.addEventListener("input", () => {
        const item = editIngredients.find(i=>i.id===el.getAttribute("data-eing-amt")); if(item) item.hoeveelheid = el.value;
      }));
      Array.from(document.querySelectorAll("[data-eing-unit]")).forEach(el => el.addEventListener("input", () => {
        const item = editIngredients.find(i=>i.id===el.getAttribute("data-eing-unit")); if(item) item.eenheid = el.value;
      }));
      Array.from(document.querySelectorAll("[data-eing-name]")).forEach(el => el.addEventListener("input", () => {
        const item = editIngredients.find(i=>i.id===el.getAttribute("data-eing-name")); if(item) item.naam = el.value;
      }));
      Array.from(document.querySelectorAll("[data-eing-link]")).forEach(el => el.addEventListener("change", () => {
        const item = editIngredients.find(i=>i.id===el.getAttribute("data-eing-link"));
        if (!item) return;
        if (!el.value){
          item.gekoppeld_item_id = null; item.gekoppeld_type = null;
        } else {
          const [type, id] = el.value.split(":");
          item.gekoppeld_type = type; item.gekoppeld_item_id = id;

      };

        <input class="field-input" id="${prefix}-con-wijnstijl" placeholder="Bv. fris/vol/complex (wit), fruitig/fijn/krachtig (rood)...">
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Persoonlijke waardering</label>
        <input class="field-input" id="${prefix}-con-waardering">
      </div>
      <div class="field-grid-2 field-row">
        <div><label class="field-label" style="font-weight:400;">Bilan van de degustatie</label>${sel("con-bilan", BILAN_OPTIES, true)}</div>
        <div><label class="field-label" style="font-weight:400;">Klimaat</label>${sel("con-klimaat", KLIMAAT_OPTIES, true)}</div>
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Bewaarpotentieel</label>
        ${sel("con-bewaarpotentieel", BEWAARPOTENTIEEL_OPTIES, true)}
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Service (temperatuur, karaferen/decanteren)</label>
        <input class="field-input" id="${prefix}-con-service" placeholder="Bv. 14-16°, decanteren aanbevolen">
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Vinificatie</label>
        ${sel("con-vinificatie", VINIFICATIE_OPTIES, true)}
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Wijn en gerechten</label>
        <textarea class="field-textarea" id="${prefix}-con-gerechten" style="min-height:50px;"></textarea>
      </div>
      <div class="field-row">
        <label class="field-label" style="font-weight:400;">Origine (voor de 'fun')</label>
        <input class="field-input" id="${prefix}-con-origine">
      </div>
    `;
  }

  let pmSelectedAromagroepen = [];

  function attachManualAddPuurHandlers(){
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));

    function toggleProfileSections(){
      const isWijn = $("#pm-categorie").value === "Wijn";
      $("#pm-generic-profile").style.display = isWijn ? "none" : "block";
      $("#pm-wijn-profile").style.display = isWijn ? "block" : "none";
      $("#pm-jaartal-wrap").style.display = isWijn ? "block" : "none";
    }
    $("#pm-categorie").addEventListener("change", toggleProfileSections);
    toggleProfileSections();

    $$("#pm-aromagroepen-chips [data-aromagroep]").forEach(chip => chip.addEventListener("click", () => {
      const val = chip.getAttribute("data-aromagroep");
      const i = pmSelectedAromagroepen.indexOf(val);
      if (i === -1) pmSelectedAromagroepen.push(val); else pmSelectedAromagroepen.splice(i,1);
      chip.classList.toggle("active");
    }));

    $("#pm-save-btn").addEventListener("click", async () => {
      const naamRaw = $("#pm-naam").value.trim();
      if (!naamRaw){ showToast("Geef een naam op"); return; }
      const categorie = $("#pm-categorie").value;
      const isWijn = categorie === "Wijn";
      const jaartal = isWijn && $("#pm-jaartal").value ? parseInt($("#pm-jaartal").value) : null;
      const naam = (isWijn && jaartal) ? `${naamRaw} ${jaartal}` : naamRaw;
      const id = "puur-" + slugify(naam) + "-" + Math.random().toString(36).slice(2,7);
      const koppelId = state.koppelVoorraadFlesId;
      const voorraadId = koppelId || ("voorraad-fles-" + slugify(naam) + "-" + Math.random().toString(36).slice(2,7));

      const item = {
        id: id,
        naam: naam,
        jaartal: jaartal,
        categorie: categorie,
        producent: $("#pm-producent").value.trim()||null,
        land: $("#pm-land").value.trim()||null,
        regio: $("#pm-regio").value.trim()||null,
        alcoholpercentage: $("#pm-alcohol").value ? parseFloat($("#pm-alcohol").value) : null,
        beschrijving: $("#pm-beschrijving").value.trim(),
        gerecht_suggestie: $("#pm-gerecht-suggestie").value.trim()||null,
        voorraad_id: voorraadId,
        bron: { type: "handmatig", referentie: null, toegevoegd_op: todayISO() },
        notities: [],
        favoriet: false,
        rating: null,
        versies: []
      };

      if (isWijn){
        const concreetRaw = $("#pm-olf-concreet").value.trim();
        item.smaakprofiel = null;
        item.wijn_degustatie = {
          wijntype: $("#pm-wijntype").value || null,
          visueel: {
            intensiteit: $("#pm-vis-intensiteit").value || null,
            helderheid: $("#pm-vis-helderheid").value || null,
            schittering: $("#pm-vis-schittering").value || null,
            kleur_nuance: $("#pm-vis-kleur").value.trim() || null,
            andere: $("#pm-vis-andere").value.trim() || null
          },
          olfactief: {
            zuiverheid: $("#pm-olf-zuiverheid").value || null,
            intensiteit: $("#pm-olf-intensiteit").value || null,
            evolutie: $("#pm-olf-evolutie").value || null,
            aromagroepen: pmSelectedAromagroepen.slice(),
            concrete_aromas: concreetRaw ? concreetRaw.split(",").map(s=>s.trim()).filter(Boolean) : [],
            aard_aromas: $("#pm-olf-aard").value || null
          },
          gustatief: {
            aanzet: {
              zuiverheid: $("#pm-gus-aanzet-zuiverheid").value || null,
              intensiteit: $("#pm-gus-aanzet-intensiteit").value || null,
              eerste_indruk: $("#pm-gus-aanzet-indruk").value.trim() || null,
              retro_olfactie: $("#pm-gus-aanzet-retro").value.trim() || null
            },
            middenmond: {
              zuren_hoeveelheid: $("#pm-gus-zuren-hvh").value || null,
              zuren_rol: $("#pm-gus-zuren-rol").value || null,
              zoetheid: $("#pm-gus-zoetheid").value || null,
              tannine_hoeveelheid: $("#pm-gus-tannine-hvh").value || null,
              tannine_aard: $("#pm-gus-tannine-aard").value || null,
              alcohol: $("#pm-gus-alcohol").value || null,
              evenwicht: $("#pm-gus-evenwicht").value.trim() || null
            },
            afdronk: {
              pai_aroma: $("#pm-gus-pai-aroma").value.trim() || null,
              pai_lengte: $("#pm-gus-pai-lengte").value || null,
              pg_smaak: $("#pm-gus-pg-smaak").value.trim() || null,
              pg_lengte: $("#pm-gus-pg-lengte").value || null
            }
          },
          conclusie: {
            wijnstijl: $("#pm-con-wijnstijl").value.trim() || null,
            persoonlijke_waardering: $("#pm-con-waardering").value.trim() || null,
            bilan: $("#pm-con-bilan").value || null,
            klimaat: $("#pm-con-klimaat").value || null,
            bewaarpotentieel: $("#pm-con-bewaarpotentieel").value || null,
            service: $("#pm-con-service").value.trim() || null,
            vinificatie: $("#pm-con-vinificatie").value || null,
            wijn_en_gerechten: $("#pm-con-gerechten").value.trim() || null,
            origine: $("#pm-con-origine").value.trim() || null
          }
        };
      } else {
        item.wijn_degustatie = null;
        item.smaakprofiel = {
          neus: $("#pm-neus").value.trim()||null,
          mond: $("#pm-mond").value.trim()||null,
          afdronk: $("#pm-afdronk").value.trim()||null,
          intensiteit: $("#pm-intensiteit").value||null,
          vrije_notities: $("#pm-vrije-notities").value.trim()||null
        };
      }

      item.versies = [{ versienummer: 1, datum: todayISO(), wijziging_omschrijving: "Origineel, handmatig ingevoerd", snapshot: Object.assign({}, item) }];
      await savePuur(item);
      if (koppelId){
        const bestaand = getVoorraadFles(koppelId);
        await saveVoorraadFles(Object.assign({}, bestaand, { naam: naam, puur_id: id }));
      } else {
        await saveVoorraadFles({ id: voorraadId, naam: naam, gesloten: 0, open: 0, puur_id: id });
      }
      state.koppelVoorraadFlesId = null;
      pmSelectedAromagroepen = [];
      showToast("Toegevoegd");
      goToPuur("detail", id);
    });
  }

  // ---------- Delegated click handler for elements that can be replaced mid-interaction ----------
  // Gedelegeerde click-handler op #app (nooit vervangen door render()) zodat de
  // stepper-knoppen in Voorraad > Flessen robuust blijven ook als een live db-update
  // net tussen mousedown en mouseup een re-render triggert.
  document.getElementById("app").addEventListener("click", async (e) => {
    const atkCheckbox = e.target.closest("[data-atk-checkbox]");
    if (atkCheckbox){
      const kbId = atkCheckbox.getAttribute("data-atk-checkbox");
      const kb = getKookboek(kbId);
      const target = state.addToKookboekOpen;
      if (!kb || !target) return;
      const isChecked = atkCheckbox.checked;
      const currentItems = kb.items ? kb.items.slice() : (kb.recept_ids || []).map(id => ({id, type: "recept"}));
      const nieuweItems = isChecked
        ? currentItems.concat([{id: target.id, type: target.type}])
        : currentItems.filter(it => !(it.id === target.id && it.type === target.type));
      const bijgewerkt = Object.assign({}, kb, { items: nieuweItems });
      delete bijgewerkt.recept_ids;
      try {
        await saveKookboek(bijgewerkt);
        showToast(isChecked ? `Toegevoegd aan "${kb.naam}"` : `Verwijderd uit "${kb.naam}"`);
      } catch(err){
        showToast("Opslaan mislukt: " + (err && err.message ? err.message : "onbekende fout"));
      }
      render();
      return;
    }
    const kbItemCheckbox = e.target.closest("[data-kb-item-checkbox]");
    if (kbItemCheckbox){
      const [type, id] = kbItemCheckbox.getAttribute("data-kb-item-checkbox").split(":");
      const kb = getKookboek(state.activeKookboekId);
      if (!kb) return;
      const isChecked = kbItemCheckbox.checked;
      const currentItems = kb.items ? kb.items.slice() : (kb.recept_ids || []).map(rid => ({id: rid, type: "recept"}));
      const nieuweItems = isChecked
        ? currentItems.concat([{id, type}])
        : currentItems.filter(it => !(it.id === id && it.type === type));
      const bijgewerkt = Object.assign({}, kb, { items: nieuweItems });
      delete bijgewerkt.recept_ids;
      try {
        await saveKookboek(bijgewerkt);
        showToast(isChecked ? "Toegevoegd" : "Verwijderd");
      } catch(err){
        showToast("Opslaan mislukt: " + (err && err.message ? err.message : "onbekende fout"));
      }
      render();
      preserveFocus("#kb-recipe-search");
      return;
    }
    const btn = e.target.closest("[data-vf-adjust]");
    if (!btn) return;
    const flesId = btn.getAttribute("data-vf-adjust");
    const item = getVoorraadFles(flesId);
    if (!item){
      showToast("Kon dit voorraad-item niet vinden. Probeer de pagina te verversen.");
      return;
    }
    const field = btn.getAttribute("data-vf-field");
    const delta = parseInt(btn.getAttribute("data-vf-delta"));
    const huidig = item[field] || 0;
    const nieuw = Math.max(0, huidig + delta);
    if (nieuw === huidig) return;
    const bijgewerktItem = Object.assign({}, item, { [field]: nieuw });
    try {
      await saveVoorraadFles(bijgewerktItem);
      const label = field === "gesloten" ? "Gesloten" : "Open";
      showToast(`${label}: ${nieuw} — opgeslagen`);
    } catch(err){
      showToast("Opslaan mislukt: " + (err && err.message ? err.message : "onbekende fout"));
    }
    render();
  });

  // ---------- Init ----------
  initAuth();

})();
</script>
</body>
</html>
